<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aegis — Enterprise-Grade Resilience. Zero Infrastructure Required.</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#fafaf9;color:#1c1917;margin:0;}
  .serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif;}
  h1,h2,h3{font-family:'Playfair Display',Georgia,serif;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulseRing{0%{transform:scale(.85);opacity:.7}100%{transform:scale(2.4);opacity:0}}
  .fade-up{animation:fadeUp .7s ease-out both;}
  .modal-bd{animation:fadeIn .18s ease-out both;}
  .modal-cd{animation:slideUp .22s ease-out both;}
  .pipe-dot{position:absolute;border-radius:50%;pointer-events:none;}
  ::selection{background:#e7e5e4;}
  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-track{background:#fafaf9;}
  ::-webkit-scrollbar-thumb{background:#d6d3d1;border-radius:2px;}
  input:focus{outline:none;}
  .fi{width:100%;border:1px solid #e7e5e4;padding:12px 14px;font-size:14px;font-family:inherit;background:#fff;border-radius:2px;transition:border-color .15s;}
  .fi:focus{border-color:#78716c;}
  .fi:disabled{background:#fafaf9;color:#a8a29e;}
  .pb{display:flex;width:100%;padding:12px;font-size:14px;font-weight:500;background:#1c1917;color:#fafaf9;border:none;border-radius:2px;cursor:pointer;transition:background .15s;font-family:inherit;align-items:center;justify-content:center;gap:8px;}
  .pb:hover:not(:disabled){background:#44403c;}
  .pb:disabled{background:#d6d3d1;cursor:not-allowed;}
  .pbo{background:transparent;color:#1c1917;border:1px solid #e7e5e4;}
  .pbo:hover:not(:disabled){background:#f5f5f4;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const TC = { normal:'#7499B4', attack:'#B36A55', sage:'#6A9479' };

/* ── Icons ── */
const Ico = ({d,cls='w-full h-full',sw=1.5}) => (
  <svg className={cls} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
    {typeof d==='string'?<path d={d}/>:d}
  </svg>
);
const ShieldIco  = ({cls}) => <Ico cls={cls} d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>;
const GlobeIco   = ({cls}) => <Ico cls={cls} d={<><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></>}/>;
const ServerIco  = ({cls}) => <Ico cls={cls} d={<><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></>}/>;
const BrainIco   = ({cls}) => <Ico cls={cls} d={<><path d="M9.5 2A2.5 2.5 0 0 0 7 4.5v.25A2.5 2.5 0 0 0 4.5 7 2.5 2.5 0 0 0 2 9.5 2.5 2.5 0 0 0 4.5 12H5"/><path d="M14.5 2A2.5 2.5 0 0 1 17 4.5v.25A2.5 2.5 0 0 1 19.5 7 2.5 2.5 0 0 1 22 9.5 2.5 2.5 0 0 1 19.5 12H19"/><path d="M12 12v9M9 18h6M9 15h6"/><circle cx="12" cy="7" r="2.5"/></>}/>;
const BoxIco     = ({cls}) => <Ico cls={cls} d={<><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></>}/>;
const ArrowIco   = ({cls='w-3.5 h-3.5'}) => <Ico cls={cls} d="M5 12h14M12 5l7 7-7 7"/>;
const BackIco    = ({cls='w-3.5 h-3.5'}) => <Ico cls={cls} d="M19 12H5M12 5l-7 7 7 7"/>;
const CloseIco   = ({cls}) => <Ico cls={cls} d="M18 6L6 18M6 6l12 12"/>;
const CheckIco   = ({cls}) => <Ico cls={cls} d="M20 6L9 17l-5-5" sw={2.5}/>;
const CopyIco    = ({cls}) => <Ico cls={cls} d={<><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></>}/>;
const ChevIco    = ({cls='w-3.5 h-3.5'}) => <Ico cls={cls} d="M6 9l6 6 6-6"/>;
const DnsIco     = ({cls}) => <Ico cls={cls} d={<><path d="M4 5h16M4 12h16M4 19h16"/><circle cx="9" cy="5" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="9" cy="19" r="1" fill="currentColor" stroke="none"/></>}/>;
const GithubIco  = ({cls}) => <Ico cls={cls} d={<path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>}/>;

/* ── Modal Shell ── */
const Modal = ({onClose,children}) => (
  <div className="modal-bd fixed inset-0 z-50 flex items-center justify-center p-4"
    style={{background:'rgba(28,25,23,0.45)',backdropFilter:'blur(4px)'}}
    onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal-cd bg-stone-50 border border-stone-200 rounded-sm w-full max-w-md relative">
      {children}
    </div>
  </div>
);

/* ── Sign In Modal ── */
const SignInModal = ({onClose,onSignIn}) => {
  const [email,setEmail] = useState('');
  const [pass,setPass]   = useState('');
  const [busy,setBusy]   = useState(false);

  const handleGoogle = () => { setBusy(true); setTimeout(onSignIn,900); };
  const handleSubmit = e => {
    e.preventDefault();
    if(!email||!pass) return;
    setBusy(true); setTimeout(onSignIn,1100);
  };

  return (
    <Modal onClose={onClose}>
      <div className="p-8">
        <button onClick={onClose} className="absolute top-5 right-5 w-5 h-5 text-stone-400 hover:text-stone-700 transition-colors"><CloseIco/></button>
        <div className="flex items-center gap-2 mb-7">
          <div className="w-4 h-4 text-stone-700"><ShieldIco/></div>
          <span className="text-sm font-semibold text-stone-900">Aegis</span>
        </div>
        <h2 className="serif text-2xl font-medium text-stone-900 mb-1">Welcome back.</h2>
        <p className="text-sm text-stone-500 mb-7">Sign in to your Aegis account.</p>

        {/* Google SSO */}
        <button onClick={handleGoogle} disabled={busy}
          className="pb pbo mb-5 w-full" style={{border:'1px solid #e7e5e4'}}>
          <svg className="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>

          Continue with Google

        <div className="flex items-center gap-3 mb-5">
          <div className="flex-1 h-px bg-stone-200"/>
          <span className="text-xs text-stone-400">or</span>
          <div className="flex-1 h-px bg-stone-200"/>
        </div>

        <form onSubmit={handleSubmit}>
          <div className="mb-4">
            <label className="block text-xs text-stone-500 mb-1.5">Email address</label>
            <input type="email" className="fi" placeholder="you@company.com"
              value={email} onChange={e=>setEmail(e.target.value)} autoFocus disabled={busy}/>
          </div>
          <div className="mb-6">
            <label className="block text-xs text-stone-500 mb-1.5">Password</label>
            <input type="password" className="fi" placeholder="••••••••"
              value={pass} onChange={e=>setPass(e.target.value)} disabled={busy}/>
          </div>
          <button type="submit" className="pb" disabled={busy||!email||!pass}>
            {busy?'Signing in…':'Sign in'}
          </button>
        </form>
      </div>
    </Modal>
  );
};

/* ── Nav ── */
const Nav = ({isLoggedIn,onSignIn,onSignOut,onProtect,onDashboard}) => {

                  <div className="w-6 h-6 rounded-full bg-stone-200 flex items-center justify-center text-xs font-bold text-stone-700 flex-shrink-0">S</div>
                  <span className="font-medium">Somraj Sarkar</span>
                  <ChevIco cls="w-3.5 h-3.5 text-stone-400"/>
                </button>

                  <>
                    <div className="fixed inset-0 z-30" onClick={()=>setAcctOpen(false)}/>
                    <div className="absolute right-0 top-full mt-1 w-52 bg-white border border-stone-200 rounded-sm shadow-sm z-40 overflow-hidden">
                      <div className="px-4 py-3 border-b border-stone-100">

                        Sign out

                    </div>

                )}
              </div>
              <button onClick={onDashboard}
                className="text-sm font-medium bg-stone-900 text-stone-50 px-4 py-2 rounded-sm hover:bg-stone-700 transition-colors">
                Dashboard
              </button>
            </>
          ) : (
            <>
              <button onClick={onSignIn} className="hidden sm:block text-sm text-stone-500 hover:text-stone-900 transition-colors">Sign in</button>
              <button onClick={onProtect} className="text-sm font-medium bg-stone-900 text-stone-50 px-4 py-2 rounded-sm hover:bg-stone-700 transition-colors">Get protected</button>
            </>
          )}
        </div>
      </div>
    </nav>
  );
};

/* ── Hero ── */
const Hero = ({onProtect}) => (

      <div className="text-xs uppercase tracking-widest text-stone-400 mb-7">Reverse Proxy Firewall · Model A · DNS-Based Deployment</div>
      <h1 className="text-6xl md:text-7xl font-medium leading-tight tracking-tight text-stone-900 mb-7">

      <div className="flex flex-wrap gap-3">
        <button onClick={onProtect}

          <div className="w-4 h-4"><GithubIco/></div>
          View on GitHub
        </a>
      </div>
    </div>
    <div className="mt-16 border border-stone-200 bg-white rounded-sm p-7 max-w-2xl">
      <div className="text-xs text-stone-400 tracking-widest uppercase mb-7">Traffic flow — your AWS VPC, shielded</div>
      <div className="relative flex items-start justify-between">
        <div className="absolute top-5 left-5 right-5 h-px bg-stone-200" style={{zIndex:0}}/>

            <div className="text-center">

/* ── Stats ── */
const Stats = () => (
  <section className="border-y border-stone-200 bg-white">
    <div className="max-w-6xl mx-auto px-8 py-11 grid grid-cols-2 md:grid-cols-4">
      {[
        {v:'1 Record', l:'DNS change required'},
        {v:'< 10ms',   l:'Added latency overhead'},

        </div>
      ))}
    </div>

);

/* ── How It Works ── */
const HowItWorks = () => {
  const steps = [
    {n:'01',tag:'DNS Redirection',sub:'Anycast routing · Zero-touch setup',
     analogy:'The attacker never sees your real address.',
     body:`Your domain's DNS A record points to the Aegis Anycast network. All traffic flows to our infrastructure first. Your origin server's true IP is completely concealed from the public internet.`,

        <h2 className="text-4xl md:text-5xl font-medium text-stone-900 leading-tight tracking-tight max-w-lg">The Model A pipeline.</h2>

/* ── Simulator ── */
const PH = {IDLE:'idle',ATTACK:'attack'};
const Simulator = () => {
  const [phase,setPhase]    = useState(PH.IDLE);
  const [dots,setDots]      = useState([]);
  const [disp,setDisp]      = useState({aegisRate:400,clientRate:400,absorbed:0});
  const phRef=useRef(PH.IDLE),dotId=useRef(0),raf=useRef(null),ts0=useRef(null);
  const cleanT=useRef(0),redT=useRef(0),dispT=useRef(0);
  const aegisRef=useRef(400),absRef=useRef(0),tos=useRef([]);
  useEffect(()=>{phRef.current=phase;},[phase]);
  useEffect(()=>{
    const loop=ts=>{
      if(!ts0.current){ts0.current=ts;raf.current=requestAnimationFrame(loop);return;}
      const dt=Math.min(ts-ts0.current,50);ts0.current=ts;
      cleanT.current+=dt;redT.current+=dt;dispT.current+=dt;
      const p=phRef.current,isAtk=p===PH.ATTACK;
      setDots(prev=>{
        let nx=[...prev];
        if(cleanT.current>=650){cleanT.current=0;
          nx.push({id:dotId.current++,x:2,y:50+Math.random()*28,speed:11,color:TC.normal,maxX:97,opacity:1,size:6});}
        if(isAtk&&redT.current>=55){redT.current=0;
          nx.push({id:dotId.current++,x:2,y:44+Math.random()*36,speed:22+Math.random()*12,
            color:TC.attack,maxX:28+Math.random()*36,opacity:1,size:8});}
        nx=nx.map(d=>d.x>=d.maxX?{...d,opacity:d.opacity-0.055}:{...d,x:d.x+d.speed*dt/1000});
        return nx.filter(d=>d.opacity>0.02&&d.x<102);
      });
      aegisRef.current+=(( isAtk?50000:400)-aegisRef.current)*0.045;
      if(isAtk) absRef.current=Math.min(absRef.current+dt*45,9999999);
      if(dispT.current>=250){dispT.current=0;
        setDisp({aegisRate:Math.round(aegisRef.current),clientRate:397+Math.round(Math.random()*9),absorbed:Math.round(absRef.current)});}
      raf.current=requestAnimationFrame(loop);
    };
    raf.current=requestAnimationFrame(loop);
    return()=>{cancelAnimationFrame(raf.current);ts0.current=null;};
  },[]);
  const simulate=()=>{if(phase===PH.ATTACK)return;tos.current.forEach(clearTimeout);absRef.current=0;setPhase(PH.ATTACK);};
  const reset=()=>{tos.current.forEach(clearTimeout);setPhase(PH.IDLE);setDots([]);aegisRef.current=400;absRef.current=0;setDisp({aegisRate:400,clientRate:400,absorbed:0});};
  const isAtk=phase===PH.ATTACK;
  const fmt=n=>n>=1000?`${(n/1000).toFixed(n>9999?0:1)}k`:String(n);
  return (
    <section id="simulator" className="bg-white border-y border-stone-200 py-24">
      <div className="max-w-6xl mx-auto px-8">
        <div className="mb-12">
          <div className="text-xs uppercase tracking-widest text-stone-400 mb-4">Model A — Interactive Demonstration</div>
          <h2 className="text-4xl md:text-5xl font-medium text-stone-900 leading-tight tracking-tight mb-4 max-w-xl">Your server never feels the storm.</h2>
          <p className="text-stone-500 text-base leading-relaxed max-w-xl">Simulate a volumetric attack. Watch Aegis absorb and neutralise the flood while clean traffic reaches your origin — completely uninterrupted.</p>
        </div>
        <div className="relative rounded-sm overflow-hidden mb-3" style={{height:'230px',border:'1px solid #e7e5e4'}}>
          <div className="absolute inset-0 flex pointer-events-none">
            <div style={{width:'22%',borderRight:'1px solid #e7e5e4',background:'#fff'}}/>
            <div style={{width:'56%',background:isAtk?'rgba(106,148,121,0.05)':'transparent',borderRight:`1px solid ${isAtk?'rgba(106,148,121,0.35)':'#e7e5e4'}`,transition:'background .9s,border-color .9s'}}/>
            <div style={{width:'22%',background:'#fff'}}/>
          </div>
          <div className="absolute top-0 inset-x-0 flex pointer-events-none" style={{zIndex:10}}>
            <div style={{width:'22%'}} className="flex flex-col items-center pt-5 gap-1">
              <div className="w-5 h-5 text-stone-400"><GlobeIco/></div>
              <div style={{fontSize:'10px',letterSpacing:'0.08em',textTransform:'uppercase',color:'#a8a29e',fontWeight:500}}>Open Internet</div>
            </div>
            <div style={{width:'56%'}} className="flex flex-col items-center pt-5 gap-1">
              <div className="w-5 h-5" style={{color:isAtk?TC.sage:'#a8a29e',transition:'color .7s'}}><ShieldIco/></div>
              <div style={{fontSize:'10px',letterSpacing:'0.08em',textTransform:'uppercase',fontWeight:600,color:isAtk?TC.sage:'#a8a29e',transition:'color .7s'}}>Aegis Cloud Shield</div>
              <div style={{display:'flex',gap:'24px',marginTop:'4px'}}>
                <span style={{fontSize:'9px',color:'#a8a29e',fontFamily:'monospace'}}>SQS Buffer</span>
                <span style={{fontSize:'9px',color:'#a8a29e',fontFamily:'monospace'}}>AI Cleanser</span>
              </div>
            </div>
            <div style={{width:'22%'}} className="flex flex-col items-center pt-5 gap-1">
              <div className="w-5 h-5" style={{color:isAtk?TC.sage:'#a8a29e',transition:'color .7s'}}><ServerIco/></div>
              <div style={{fontSize:'10px',letterSpacing:'0.08em',textTransform:'uppercase',fontWeight:isAtk?600:400,color:isAtk?TC.sage:'#a8a29e',transition:'color .7s'}}>
                {isAtk?'✓ Stable':'Your Origin'}
              </div>
            </div>
          </div>
          <div style={{position:'absolute',insetBlock:0,left:'50%',width:'1px',background:'rgba(106,148,121,0.18)',opacity:isAtk?1:0,transition:'opacity .7s',zIndex:5}}/>
          <div className="absolute inset-0 pointer-events-none" style={{zIndex:20}}>
            {dots.map(d=><div key={d.id} className="pipe-dot" style={{left:`${d.x}%`,top:`${d.y}%`,width:`${d.size}px`,height:`${d.size}px`,background:d.color,opacity:d.opacity,transform:'translateY(-50%)'}}/>)}
          </div>
        </div>
        <div className="flex flex-wrap items-center gap-6 mb-8 text-xs text-stone-400">
          <div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full" style={{background:TC.normal,display:'inline-block'}}/>Legitimate traffic</div>
          {isAtk&&<div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full" style={{background:TC.attack,display:'inline-block'}}/>Malicious (absorbed inside Aegis)</div>}
        </div>
        <div className="grid md:grid-cols-3 gap-4 mb-8">
          {[
            {label:'Aegis Ingestion',    val:`${fmt(disp.aegisRate)} req/s`,  sub:isAtk?'▲ Absorbing flood':'— Nominal',  c:isAtk?TC.attack:'#a8a29e'},
            {label:'Client Server Load', val:`${disp.clientRate} req/s`,      sub:isAtk?'✓ Stable — shielded':'— Nominal', c:isAtk?TC.sage:'#a8a29e'},
            {label:'Packets Neutralised',val:disp.absorbed.toLocaleString(),  sub:isAtk?'Dropped in Aegis buffer':'— No active attack', c:'#a8a29e'},
          ].map((m,i)=>(
            <div key={i} className="border border-stone-200 rounded-sm p-5">
              <div className="text-xs text-stone-400 uppercase tracking-widest mb-3">{m.label}</div>
              <div className="serif text-3xl font-medium text-stone-900 mb-1.5">{m.val}</div>
              <div className="text-xs" style={{color:m.c,fontWeight:i<2&&isAtk?500:400}}>{m.sub}</div>
            </div>
          ))}
        </div>
        <div className="flex items-center justify-between flex-wrap gap-4 pt-6 border-t border-stone-200">
          <div className={`flex items-start gap-2.5 max-w-sm transition-opacity duration-500 ${isAtk?'opacity-100':'opacity-0 pointer-events-none'}`}>
            <span className="w-2 h-2 rounded-full mt-1.5 flex-shrink-0" style={{background:TC.sage,animation:isAtk?'blink 1.4s infinite':undefined}}/>
            <div>
              <div className="font-medium text-sm text-stone-700">Aegis is absorbing the attack.</div>
              <div className="text-stone-400 text-xs mt-0.5 leading-relaxed">Malicious packets are trapped inside Aegis. Clean traffic continues reaching your origin uninterrupted.</div>
            </div>
          </div>
          <div className="flex items-center gap-4">
            {isAtk&&<button onClick={reset} className="text-sm text-stone-400 hover:text-stone-700 transition-colors underline underline-offset-2">Reset</button>}
            <button onClick={simulate} disabled={isAtk}
              className={`text-sm font-medium px-5 py-2.5 rounded-sm border transition-colors ${isAtk?'border-stone-200 text-stone-300 cursor-not-allowed bg-stone-50':'border-stone-300 text-stone-700 hover:bg-stone-100'}`}>
              {isAtk?'Attack in progress…':'Simulate volumetric attack'}
            </button>
          </div>
        </div>
      </div>
    </section>
  );
};

/* ── Onboarding View ── */
const STEP_LABELS = ['Domain Verification','DNS Configuration','Deployment'];

const Onboarding = ({onBack}) => {
  const [step,setStep]     = useState(1);
  const [domain,setDomain] = useState('');
  const [verifying,setVerifying]   = useState(false);
  const [propagating,setPropagating] = useState(false);
  const [success,setSuccess]       = useState(false);
  const [copied,setCopied]         = useState(false);

  const cleanDomain = domain.replace(/^https?:\/\//,'').replace(/\/.*/,'').trim() || 'yourdomain.com';

  const handleVerify = e => {
    e.preventDefault();
    if(!domain.trim()) return;
    setVerifying(true);
    setTimeout(()=>{ setVerifying(false); setStep(2); }, 1600);
  };

  const handleDnsConfirm = () => {
    setStep(3); setPropagating(true);
    setTimeout(()=>{ setPropagating(false); setSuccess(true); }, 3800);
  };

  const copyTarget = () => {
    navigator.clipboard.writeText('ingress.aegis-shield.net').then(()=>{
      setCopied(true); setTimeout(()=>setCopied(false),2000);
    });
  };

  return (
    <div style={{minHeight:'100vh',background:'#fafaf9'}}>
      {/* Progress bar */}
      <div className="fixed top-16 inset-x-0 z-30 h-px bg-stone-100">
        <div className="h-full bg-stone-300 transition-all duration-700 ease-in-out"
          style={{width:step===1?'33%':step===2?'66%':'100%'}}/>
      </div>

      <div className="pt-28 pb-24 max-w-xl mx-auto px-8">
        {/* Back */}
        <button onClick={onBack}
          className="flex items-center gap-1.5 text-sm text-stone-400 hover:text-stone-700 transition-colors mb-12">
          <BackIco/> Back to landing
        </button>

        {/* Stepper */}
        <div className="flex items-start mb-16">
          {STEP_LABELS.map((label,i)=>(
            <React.Fragment key={i}>
              <div className="flex flex-col items-center gap-2.5" style={{minWidth:'80px'}}>
                <div className="w-7 h-7 rounded-full flex items-center justify-center text-xs font-semibold flex-shrink-0 transition-all duration-400"
                  style={{
                    background: step>=i+1?'#1c1917':'#f5f5f4',
                    color: step>=i+1?'#fafaf9':'#a8a29e',
                    border: step>i+1||step===i+1?'none':'1px solid #e7e5e4'
                  }}>
                  {step>i+1
                    ? <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                    : i+1}
                </div>
                <span className="text-xs text-center leading-tight"
                  style={{
                    color: step===i+1?'#1c1917':step>i+1?'#78716c':'#a8a29e',
                    fontWeight: step===i+1?500:400,
                    maxWidth:'70px'
                  }}>
                  {label}
                </span>
              </div>
              {i<STEP_LABELS.length-1&&(
                <div className="flex-1 h-px mt-3.5 mx-3 transition-all duration-700"
                  style={{background:step>i+1?'#1c1917':'#e7e5e4'}}/>
              )}
            </React.Fragment>
          ))}
        </div>

        {/* ── Step 1: Domain ── */}
        {step===1&&(
          <div className="fade-up">
            <div className="text-xs uppercase tracking-widest text-stone-400 mb-4">Step 1 of 3</div>
            <h2 className="serif text-4xl font-medium text-stone-900 leading-tight mb-3">Verify your domain.</h2>
            <p className="text-stone-500 leading-relaxed mb-10 text-sm">
              Enter the domain you wish to protect. We'll generate the exact DNS record you need to add — no other configuration required.
            </p>
            <form onSubmit={handleVerify}>
              <div className="mb-2">
                <label className="block text-xs text-stone-500 mb-2 tracking-wide uppercase">Domain to protect</label>
                <input type="text" className="fi" placeholder="api.example.com" autoFocus
                  value={domain} onChange={e=>setDomain(e.target.value)} disabled={verifying}
                  style={{fontSize:'16px',padding:'13px 15px'}}/>
              </div>
              <p className="text-xs text-stone-400 mb-8">Enter the root domain or subdomain you want shielded by Aegis.</p>
              <button type="submit" className="pb" disabled={verifying||!domain.trim()} style={{padding:'13px'}}>
                {verifying?'Verifying domain…':'Verify Domain →'}
              </button>
            </form>
          </div>
        )}

        {/* ── Step 2: DNS ── */}
        {step===2&&(
          <div className="fade-up">
            <div className="text-xs uppercase tracking-widest text-stone-400 mb-4">Step 2 of 3</div>
            <h2 className="serif text-4xl font-medium text-stone-900 leading-tight mb-3">Configure your DNS.</h2>
            <p className="text-stone-500 leading-relaxed mb-8 text-sm">
              Add the following record to your DNS provider for{' '}
              <strong className="text-stone-800 font-medium">{cleanDomain}</strong>.
              This redirects all incoming traffic through the Aegis network before it reaches your origin.
            </p>

            {/* DNS Record Table */}
            <div className="border border-stone-200 rounded-sm overflow-hidden mb-3">
              <div className="flex items-center justify-between px-5 py-3 bg-stone-50 border-b border-stone-200">
                <span className="text-xs text-stone-500 font-medium uppercase tracking-widest">DNS Record to Add</span>
                <button onClick={copyTarget}
                  className="flex items-center gap-1.5 text-xs text-stone-500 hover:text-stone-800 transition-colors">
                  <div className="w-3 h-3"><CopyIco/></div>
                  {copied?'Copied!':'Copy target'}
                </button>
              </div>
              <table className="w-full">
                <tbody>
                  {[
                    ['Type',   'CNAME'],
                    ['Name',   '@'],
                    ['Target', 'ingress.aegis-shield.net'],
                    ['TTL',    '300'],
                  ].map(([k,v],i,arr)=>(
                    <tr key={k} className={i<arr.length-1?'border-b border-stone-100':''}>
                      <td className="px-5 py-3.5 text-xs font-medium text-stone-400 uppercase tracking-wide w-20">{k}</td>
                      <td className="px-5 py-3.5 text-sm text-stone-800 font-mono">{v}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <p className="text-xs text-stone-400 leading-relaxed mb-8">
              DNS changes typically propagate within 5–30 minutes but may take up to 48 hours. We'll verify propagation automatically after you confirm.
            </p>
            <button className="pb mb-3" onClick={handleDnsConfirm} style={{padding:'13px'}}>
              I've added the DNS record →
            </button>
            <button className="pb pbo" onClick={()=>setStep(1)} style={{padding:'11px',fontSize:'13px'}}>
              Back
            </button>
          </div>
        )}

        {/* ── Step 3: Propagation ── */}
        {step===3&&(
          <div className="fade-up">
            <div className="text-xs uppercase tracking-widest text-stone-400 mb-4">Step 3 of 3</div>

            {!success?(
              /* Propagating state */
              <div className="text-center py-6">
                {/* Pulsing rings */}
                <div className="relative w-16 h-16 mx-auto mb-10">
                  <div className="absolute inset-0 rounded-full"
                    style={{background:'rgba(106,148,121,0.12)',animation:'pulseRing 2.2s ease-out infinite'}}/>
                  <div className="absolute inset-0 rounded-full"
                    style={{background:'rgba(106,148,121,0.18)',animation:'pulseRing 2.2s ease-out 0.65s infinite'}}/>
                  <div className="absolute inset-4 rounded-full flex items-center justify-center"
                    style={{background:TC.sage}}>
                    <div className="w-4 h-4 text-white"><ShieldIco/></div>
                  </div>
                </div>
                <h2 className="serif text-3xl font-medium text-stone-900 leading-tight mb-4">
                  Awaiting DNS Propagation…
                </h2>
                <p className="text-stone-500 text-sm leading-relaxed max-w-sm mx-auto mb-2">
                  Verifying that <strong className="text-stone-700 font-medium">{cleanDomain}</strong> is pointing to the Aegis network.
                </p>
                <p className="text-xs text-stone-400">DNS changes can take up to 24 hours to propagate globally.</p>
              </div>
            ):(
              /* Success state */
              <div className="text-center py-4 fade-up">
                <div className="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-8"
                  style={{background:'rgba(106,148,121,0.1)'}}>
                  <div className="w-7 h-7" style={{color:TC.sage}}><ShieldIco/></div>
                </div>
                <div className="text-xs uppercase tracking-widest font-medium mb-4" style={{color:TC.sage}}>Protected</div>
                <h2 className="serif text-3xl font-medium text-stone-900 leading-tight mb-3">
                  Traffic is now routed through<br/>the Aegis Cloud.
                </h2>
                <p className="text-stone-500 text-sm leading-relaxed mb-8">
                  <strong className="text-stone-800 font-medium">{cleanDomain}</strong> is fully shielded. Your origin IP is hidden and the AI engine is actively monitoring.
                </p>
                <div className="border border-stone-200 rounded-sm text-left divide-y divide-stone-100 mb-8 max-w-xs mx-auto">
                  {[
                    ['Origin IP concealed',   'Active'],
                    ['SQS buffer provisioned','Active'],
                    ['AI anomaly monitoring', 'Monitoring'],
                    ['VPC NACL response',     'Armed'],
                  ].map(([l,s])=>(
                    <div key={l} className="flex items-center justify-between px-5 py-3.5">
                      <span className="text-sm text-stone-600">{l}</span>
                      <span className="text-xs font-medium" style={{color:TC.sage}}>✓ {s}</span>
                    </div>
                  ))}
                </div>
                <button className="pb max-w-xs mx-auto" onClick={onBack} style={{padding:'13px'}}>
                  Back to dashboard
                </button>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
};

/* ── App Root ── */
const App = () => {
  const [isLoggedIn, setIsLoggedIn] = useState(false);
  const [modal,  setModal]  = useState(null);     // null | 'signin'
  const [view,   setView]   = useState('landing'); // 'landing' | 'onboarding'

  const signIn     = useCallback(()=>{ setIsLoggedIn(true); setModal(null); }, []);
  const signOut    = useCallback(()=>{ setIsLoggedIn(false); }, []);
  const openSignIn = useCallback(()=>setModal('signin'), []);
  const closeModal = useCallback(()=>setModal(null), []);
  const goProtect  = useCallback(()=>{ setView('onboarding'); window.scrollTo(0,0); }, []);
  const goLanding  = useCallback(()=>{ setView('landing');   window.scrollTo(0,0); }, []);

  return (
    <div className="bg-stone-50">
      {modal==='signin' && <SignInModal onClose={closeModal} onSignIn={signIn}/>}

      <Nav
        isLoggedIn={isLoggedIn}
        onSignIn={openSignIn}
        onSignOut={signOut}
        onProtect={goProtect}
        onDashboard={goLanding}
      />

      {view==='landing' && (
        <>
          <Hero     onProtect={goProtect}/>
          <Stats/>
          <HowItWorks/>
          <Simulator/>
          <Research/>
          <CTA      onProtect={goProtect}/>
          <Footer   onSignIn={openSignIn} onProtect={goProtect}/>
        </>
      )}

      {view==='onboarding' && <Onboarding onBack={goLanding}/>}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
