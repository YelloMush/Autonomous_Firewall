<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aegis — Enterprise-Grade Resilience. Zero Infrastructure Required.</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#fafaf9;color:#1c1917;margin:0;}
  .serif{font-family:'Playfair Display',Georgia,serif;}
  h1,h2,h3{font-family:'Playfair Display',Georgia,serif;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulseRing{0%{transform:scale(.85);opacity:.7}100%{transform:scale(2.4);opacity:0}}
  @keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .fade-up{animation:fadeUp .6s ease-out both;}
  .modal-bd{animation:fadeIn .18s ease-out both;}
  .modal-cd{animation:slideUp .22s ease-out both;}
  .pipe-dot{position:absolute;border-radius:50%;pointer-events:none;}
  ::selection{background:#e7e5e4;}
  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-track{background:#fafaf9;}
  ::-webkit-scrollbar-thumb{background:#d6d3d1;border-radius:2px;}
  input:focus{outline:none;}
  .fi{width:100%;border:1px solid #e7e5e4;padding:12px 14px;font-size:14px;font-family:inherit;background:#fff;border-radius:2px;transition:border-color .15s;}
  .fi:focus{border-color:#78716c;}
  .fi:disabled{background:#fafaf9;color:#a8a29e;}
  .pb{display:flex;width:100%;padding:12px;font-size:14px;font-weight:500;background:#1c1917;color:#fafaf9;border:none;border-radius:2px;cursor:pointer;transition:background .15s;font-family:inherit;align-items:center;justify-content:center;gap:8px;}
  .pb:hover:not(:disabled){background:#44403c;}
  .pb:disabled{background:#d6d3d1;cursor:not-allowed;}
  .pbo{background:transparent;color:#1c1917;border:1px solid #e7e5e4;}
  .pbo:hover:not(:disabled){background:#f5f5f4;}
  .card{border:1px solid #e7e5e4;border-radius:2px;background:#fff;}
  .metric-bar{position:relative;height:2px;background:#f5f5f4;border-radius:9999px;}
  .metric-bar-fill{position:absolute;height:100%;border-radius:9999px;transition:width .12s linear;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ── API base ── */
const API_BASE = 'http://localhost:8001';

/* ── Brand colours ── */
const TC = { normal:'#7499B4', attack:'#B36A55', sage:'#6A9479', amber:'#92400e', amberBar:'#b45309' };

/* ─────────────────── ICONS ─────────────────── */
const Ico = ({d,cls='w-full h-full',sw=1.5,fill='none'}) => (
  <svg className={cls} viewBox="0 0 24 24" fill={fill} stroke="currentColor"
    strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
    {typeof d==='string'?<path d={d}/>:d}
  </svg>
);
const ShieldIco  = ({cls}) => <Ico cls={cls} d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>;
const GlobeIco   = ({cls}) => <Ico cls={cls} d={<><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></>}/>;
const ServerIco  = ({cls}) => <Ico cls={cls} d={<><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></>}/>;
const BrainIco   = ({cls}) => <Ico cls={cls} d={<><path d="M9.5 2A2.5 2.5 0 0 0 7 4.5v.25A2.5 2.5 0 0 0 4.5 7 2.5 2.5 0 0 0 2 9.5 2.5 2.5 0 0 0 4.5 12H5"/><path d="M14.5 2A2.5 2.5 0 0 1 17 4.5v.25A2.5 2.5 0 0 1 19.5 7 2.5 2.5 0 0 1 22 9.5 2.5 2.5 0 0 1 19.5 12H19"/><path d="M12 12v9M9 18h6M9 15h6"/><circle cx="12" cy="7" r="2.5"/></>}/>;
const BoxIco     = ({cls}) => <Ico cls={cls} d={<><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></>}/>;
const ArrowIco   = ({cls='w-3.5 h-3.5'}) => <Ico cls={cls} d="M5 12h14M12 5l7 7-7 7"/>;
const BackIco    = ({cls='w-3.5 h-3.5'}) => <Ico cls={cls} d="M19 12H5M12 5l-7 7 7 7"/>;
const CloseIco   = ({cls}) => <Ico cls={cls} d="M18 6L6 18M6 6l12 12"/>;
const CopyIco    = ({cls}) => <Ico cls={cls} d={<><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></>}/>;
const ChevIco    = ({cls='w-3.5 h-3.5'}) => <Ico cls={cls} d="M6 9l6 6 6-6"/>;
const DnsIco     = ({cls}) => <Ico cls={cls} d={<><path d="M4 5h16M4 12h16M4 19h16"/><circle cx="9" cy="5" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="9" cy="19" r="1" fill="currentColor" stroke="none"/></>}/>;
const GithubIco  = ({cls}) => <Ico cls={cls} d={<path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>}/>;
const NaclIco    = ({cls}) => <Ico cls={cls} d={<><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/></>}/>;

/* ─────────────────── MODAL SHELL ─────────────────── */
const Modal = ({onClose,children}) => (
  <div className="modal-bd fixed inset-0 z-50 flex items-center justify-center p-4"
    style={{background:'rgba(28,25,23,0.45)',backdropFilter:'blur(4px)'}}
    onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal-cd bg-stone-50 border border-stone-200 rounded-sm w-full max-w-md relative">
      {children}
    </div>
  </div>
);

/* ─────────────────── SIGN IN MODAL ─────────────────── */
const SignInModal = ({onClose,onSignIn}) => {
  const [email,setEmail] = useState('');
  const [pass,setPass]   = useState('');
  const [busy,setBusy]   = useState(false);
  const handleGoogle = () => { setBusy(true); setTimeout(onSignIn,900); };
  const handleSubmit = e => { e.preventDefault(); if(!email||!pass) return; setBusy(true); setTimeout(onSignIn,1100); };
  return (
    <Modal onClose={onClose}>
      <div className="p-8">
        <button onClick={onClose} className="absolute top-5 right-5 w-5 h-5 text-stone-400 hover:text-stone-700 transition-colors"><CloseIco/></button>
        <div className="flex items-center gap-2 mb-7"><div className="w-4 h-4 text-stone-700"><ShieldIco/></div><span className="text-sm font-semibold text-stone-900">Aegis</span></div>
        <h2 className="serif text-2xl font-medium text-stone-900 mb-1">Welcome back.</h2>
        <p className="text-sm text-stone-500 mb-7">Sign in to your Aegis account.</p>
        <button onClick={handleGoogle} disabled={busy} className="pb pbo mb-5 w-full" style={{border:'1px solid #e7e5e4'}}>
          <svg className="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>
        <div className="flex items-center gap-3 mb-5"><div className="flex-1 h-px bg-stone-200"/><span className="text-xs text-stone-400">or</span><div className="flex-1 h-px bg-stone-200"/></div>
        <form onSubmit={handleSubmit}>
          <div className="mb-4"><label className="block text-xs text-stone-500 mb-1.5">Email address</label><input type="email" className="fi" placeholder="you@company.com" value={email} onChange={e=>setEmail(e.target.value)} autoFocus disabled={busy}/></div>
          <div className="mb-6"><label className="block text-xs text-stone-500 mb-1.5">Password</label><input type="password" className="fi" placeholder="••••••••" value={pass} onChange={e=>setPass(e.target.value)} disabled={busy}/></div>
          <button type="submit" className="pb" disabled={busy||!email||!pass}>{busy?'Signing in…':'Sign in'}</button>
        </form>
      </div>
    </Modal>
  );
};

/* ─────────────────── NAV ─────────────────── */
const Nav = ({isLoggedIn,onSignIn,onSignOut,onProtect,onDashboard}) => {
  const [solid,setSolid]       = useState(false);
  const [acctOpen,setAcctOpen] = useState(false);
  useEffect(()=>{
    const h=()=>setSolid(window.scrollY>50);
    window.addEventListener('scroll',h); return ()=>window.removeEventListener('scroll',h);

  return (
    <nav className={`fixed top-0 inset-x-0 z-40 transition-all duration-300 ${solid?'bg-stone-50/96 backdrop-blur-md border-b border-stone-200':'bg-transparent'}`}>
      <div className="max-w-6xl mx-auto px-8 h-16 flex items-center justify-between">
        <div className="flex items-center gap-2.5">
          <div className="w-4 h-4 text-stone-700"><ShieldIco/></div>
          <span className="text-sm font-semibold tracking-tight text-stone-900">Aegis</span>
          <span className="ml-1 text-xs text-stone-400 border border-stone-200 px-2 py-0.5 rounded-full">Model A</span>
        </div>
        <div className="hidden md:flex gap-8 text-sm text-stone-500">
          {[['#how','How it works'],['#simulator','Simulator'],['#research','Research']].map(([h,l])=>(
            <a key={h} href={h} className="hover:text-stone-900 transition-colors">{l}</a>
          ))}
        </div>
        <div className="flex items-center gap-3">
          {isLoggedIn ? (
            <>
              <div className="relative">
                <button onClick={()=>setAcctOpen(o=>!o)} className="hidden sm:flex items-center gap-2 text-sm text-stone-600 hover:text-stone-900 transition-colors py-1 px-1 rounded-sm">
                  <div className="w-6 h-6 rounded-full bg-stone-200 flex items-center justify-center text-xs font-bold text-stone-700 flex-shrink-0">S</div>
                  <span className="font-medium">Somraj Sarkar</span>
                  <ChevIco cls="w-3.5 h-3.5 text-stone-400"/>
                </button>
                {acctOpen && (
                  <>
                    <div className="fixed inset-0 z-30" onClick={()=>setAcctOpen(false)}/>
                    <div className="absolute right-0 top-full mt-1 w-52 bg-white border border-stone-200 rounded-sm shadow-sm z-40 overflow-hidden">
                      <div className="px-4 py-3 border-b border-stone-100">
                        <div className="text-xs font-semibold text-stone-800">Somraj Sarkar</div>
                        <div className="text-xs text-stone-400 mt-0.5">somraj@example.com</div>
                      </div>
                      <button className="block w-full text-left px-4 py-2.5 text-sm text-stone-600 hover:bg-stone-50 transition-colors">Account settings</button>
                      <button onClick={()=>{setAcctOpen(false);onSignOut();}} className="block w-full text-left px-4 py-2.5 text-sm text-stone-600 hover:bg-stone-50 transition-colors border-t border-stone-100">Sign out</button>
                    </div>
                  </>
                )}
              </div>
              <button onClick={onDashboard} className="text-sm font-medium bg-stone-900 text-stone-50 px-4 py-2 rounded-sm hover:bg-stone-700 transition-colors">Dashboard</button>
            </>
          ) : (
            <>
              <button onClick={onSignIn} className="hidden sm:block text-sm text-stone-500 hover:text-stone-900 transition-colors">Sign in</button>
              <button onClick={onProtect} className="text-sm font-medium bg-stone-900 text-stone-50 px-4 py-2 rounded-sm hover:bg-stone-700 transition-colors">Get protected</button>
            </>
          )}
        </div>
      </div>
    </nav>
  );
};

/* ─────────────────── HERO ─────────────────── */
const Hero = ({onProtect}) => (
  <section id="hero" className="pt-36 pb-20 max-w-6xl mx-auto px-8">
    <div className="max-w-2xl fade-up">
      <div className="text-xs uppercase tracking-widest text-stone-400 mb-7">Reverse Proxy Firewall · Model A · DNS-Based Deployment</div>
      <h1 className="text-6xl md:text-7xl font-medium leading-tight tracking-tight text-stone-900 mb-7">
        Enterprise-grade resilience.<br/><em className="text-stone-500">Zero infrastructure required.</em>
      </h1>
      <p className="text-lg text-stone-500 leading-loose font-light mb-10 max-w-lg">Update a single DNS record. Aegis routes all traffic through our distributed cloud buffers, evaluates every request with unsupervised machine learning, and delivers only clean traffic to your origin server.</p>
      <div className="flex flex-wrap gap-3">
        <button onClick={onProtect} className="inline-flex items-center gap-2 text-sm font-medium bg-stone-900 text-stone-50 px-6 py-3 rounded-sm hover:bg-stone-700 transition-colors">
          Get protected <ArrowIco/>
        </button>
        <a href="https://github.com/YelloMush/Autonomous_Firewall" target="_blank" rel="noopener" className="inline-flex items-center gap-2 text-sm font-medium border border-stone-300 text-stone-700 px-6 py-3 rounded-sm hover:bg-stone-100 transition-colors">
          <div className="w-4 h-4"><GithubIco/></div>View on GitHub
        </a>
      </div>
    </div>
    <div className="mt-16 border border-stone-200 bg-white rounded-sm p-7 max-w-2xl">
      <div className="text-xs text-stone-400 tracking-widest uppercase mb-7">Traffic flow — your AWS VPC, shielded</div>
      <div className="relative flex items-start justify-between">
        <div className="absolute top-5 left-5 right-5 h-px bg-stone-200" style={{zIndex:0}}/>
        {[
          {icon:<DnsIco/>,label:'DNS Update',sub:'1 record change'},
          {icon:<BoxIco/>,label:'Aegis Buffer',sub:'SQS absorbs'},
          {icon:<BrainIco/>,label:'AI Cleanser',sub:'Isolation Forest'},
          {icon:<ServerIco/>,label:'Your Server',sub:'Clean traffic only'},
        ].map((n,i)=>(
          <div key={i} className="relative z-10 flex flex-col items-center gap-2">
            <div className="w-10 h-10 rounded-full bg-stone-50 border border-stone-300 flex items-center justify-center">
              <div className="w-4 h-4 text-stone-500">{n.icon}</div>
            </div>
            <div className="text-center"><div className="text-xs font-medium text-stone-700">{n.label}</div><div className="text-xs text-stone-400">{n.sub}</div></div>
          </div>
        ))}
      </div>
    </div>
  </section>
);

/* ─────────────────── STATS ─────────────────── */
const Stats = () => (
  <section className="border-y border-stone-200 bg-white">
    <div className="max-w-6xl mx-auto px-8 py-11 grid grid-cols-2 md:grid-cols-4">
      {[{v:'1 Record',l:'DNS change required'},{v:'< 10ms',l:'Added latency overhead'},{v:'99.99%',l:'Platform uptime SLA'},{v:'100%',l:'Origin IP concealment'}].map((s,i)=>(
        <div key={i} className={`px-8 py-2 ${i>0?'border-l border-stone-200':''} ${i===0?'pl-0':''}`}>
          <div className="serif text-3xl font-medium text-stone-900 mb-1">{s.v}</div>
          <div className="text-sm text-stone-400 leading-snug">{s.l}</div>
        </div>
      ))}
    </div>
  </section>
);

/* ─────────────────── HOW IT WORKS ─────────────────── */
const HowItWorks = () => {
  const steps = [
    {n:'01',tag:'DNS Redirection',sub:'Anycast routing · Zero-touch setup',analogy:'The attacker never sees your real address.',body:`Your domain's DNS A record points to the Aegis Anycast network. All traffic flows to our infrastructure first. Your origin server's true IP is completely concealed.`,tech:'Anycast DNS · BGP routing'},
    {n:'02',tag:'The Multi-Tenant Buffer',sub:'Amazon SQS · Cloud queue',analogy:'An infinitely expanding shock absorber.',body:'All global traffic hits our SQS queue before touching your origin. A million packets per second simply fills the queue — your origin is completely decoupled from the flood.',tech:'Amazon SQS · Horizontal scaling'},
    {n:'03',tag:'The AI Cleanser',sub:'Isolation Forest · Real-time inference',analogy:'Identifies anomalies without knowing the attack.',body:'Our Isolation Forest model evaluates each request batch in real time. It detects statistically abnormal traffic distributions — novel attack patterns, volumetric floods, zero-days — without signature databases.',tech:'Scikit-Learn · FastAPI · Real-time inference'},
    {n:'04',tag:'The Clean Pipe',sub:'Reverse proxy · Encrypted tunnel',analogy:'Only clean traffic reaches your door.',body:'Verified, clean requests are forwarded to your origin through a high-bandwidth encrypted tunnel. Your server receives the same steady, predictable load it always has.',tech:'Reverse proxy · TLS tunnel · Origin shield'},
  ];
  return (
    <section id="how" className="py-24 max-w-6xl mx-auto px-8">
      <div className="mb-16">
        <div className="text-xs uppercase tracking-widest text-stone-400 mb-4">How it works</div>
        <h2 className="text-4xl md:text-5xl font-medium text-stone-900 leading-tight tracking-tight max-w-lg">The Model A pipeline.</h2>
        <p className="text-stone-500 text-base leading-relaxed mt-4 max-w-xl">A four-stage reverse proxy architecture that routes, absorbs, cleanses, and delivers.</p>
      </div>
      <div className="grid md:grid-cols-2 gap-x-14 gap-y-12">
        {steps.map((p,i)=>(
          <div key={i} className="border-t border-stone-200 pt-7">
            <div className="flex items-start justify-between mb-5">
              <div><div className="text-xs text-stone-400 tracking-widest uppercase mb-1">{p.tag}</div><div className="text-sm text-stone-400">{p.sub}</div></div>
              <span className="serif text-5xl font-light text-stone-100 leading-none select-none">{p.n}</span>
            </div>
            <p className="text-sm text-stone-500 italic border-l-2 border-stone-200 pl-3 mb-4 leading-relaxed">"{p.analogy}"</p>
            <p className="text-sm text-stone-600 leading-relaxed mb-5">{p.body}</p>
            <span className="text-xs text-stone-400 font-mono">{p.tech}</span>
          </div>
        ))}
      </div>
    </section>
  );
};

/* ─────────────────── SIMULATOR ─────────────────── */
const PH = {IDLE:'idle',ATTACK:'attack'};
const Simulator = () => {
  const [phase,setPhase]    = useState(PH.IDLE);
  const [dots,setDots]      = useState([]);
  const [disp,setDisp]      = useState({aegisRate:400,clientRate:400,absorbed:0});
  const phRef=useRef(PH.IDLE),dotId=useRef(0),raf=useRef(null),ts0=useRef(null);
  const cleanT=useRef(0),redT=useRef(0),dispT=useRef(0);
  const aegisRef=useRef(400),absRef=useRef(0);
  useEffect(()=>{phRef.current=phase;},[phase]);
  useEffect(()=>{
    const loop=ts=>{
      if(!ts0.current){ts0.current=ts;raf.current=requestAnimationFrame(loop);return;}
      const dt=Math.min(ts-ts0.current,50);ts0.current=ts;
      cleanT.current+=dt;redT.current+=dt;dispT.current+=dt;
      const p=phRef.current,isAtk=p===PH.ATTACK;
      setDots(prev=>{
        let nx=[...prev];
        if(cleanT.current>=650){cleanT.current=0;nx.push({id:dotId.current++,x:2,y:50+Math.random()*28,speed:11,color:TC.normal,maxX:97,opacity:1,size:6});}
        if(isAtk&&redT.current>=55){redT.current=0;nx.push({id:dotId.current++,x:2,y:44+Math.random()*36,speed:22+Math.random()*12,color:TC.attack,maxX:28+Math.random()*36,opacity:1,size:8});}
        nx=nx.map(d=>d.x>=d.maxX?{...d,opacity:d.opacity-0.055}:{...d,x:d.x+d.speed*dt/1000});
        return nx.filter(d=>d.opacity>0.02&&d.x<102);
      });
      aegisRef.current+=((isAtk?50000:400)-aegisRef.current)*0.045;
      if(isAtk) absRef.current=Math.min(absRef.current+dt*45,9999999);
      if(dispT.current>=250){dispT.current=0;setDisp({aegisRate:Math.round(aegisRef.current),clientRate:397+Math.round(Math.random()*9),absorbed:Math.round(absRef.current)});}
      raf.current=requestAnimationFrame(loop);
    };
    raf.current=requestAnimationFrame(loop);
    return()=>{cancelAnimationFrame(raf.current);ts0.current=null;};
  },[]);
  const simulate=()=>{if(phase===PH.ATTACK)return;absRef.current=0;setPhase(PH.ATTACK);};
  const reset=()=>{setPhase(PH.IDLE);setDots([]);aegisRef.current=400;absRef.current=0;setDisp({aegisRate:400,clientRate:400,absorbed:0});};
  const isAtk=phase===PH.ATTACK;
  const fmt=n=>n>=1000?`${(n/1000).toFixed(n>9999?0:1)}k`:String(n);
  return (

    phaseTimerRef.current = setTimeout(() => {
      setPhase('mitigating');
      addEvent('Boto3 NACL rules injected via aws_infrastructure/aegis_nacl.py.', 'success');
      addEvent('847 malicious IP ranges blocked. Attacker traffic dropped at the edge.', 'success');
      addEvent('Origin server fully isolated. Load normalizing.', 'success');
      addEvent('Threat neutralized. System secured. Nominal monitoring resumed.', 'success');
      setNaclRules([
        { rule:100, cidr:'203.0.113.0/24',  proto:'ALL', dir:'INBOUND', hits:'42,301' },
        { rule:110, cidr:'198.51.100.0/24', proto:'ALL', dir:'INBOUND', hits:'38,192' },
        { rule:120, cidr:'10.42.0.0/16',    proto:'ALL', dir:'INBOUND', hits:'21,445' },
      ]);
    }, 3000);
    return () => { if (phaseTimerRef.current) clearTimeout(phaseTimerRef.current); };
  }, [phase]);

  /* initial event */
  useEffect(() => {
    addEvent(`Aegis protection active for ${domain}. Monitoring live traffic.`, 'info');
  }, []);

  /* ── Animation loop (120ms ticks) ── */
  useEffect(() => {
    const loop = setInterval(() => {
      const p = phaseRef.current;
      const m = metricsRef.current;
      const j = (v, r) => v + (Math.random()-0.5)*2*r;

      let tE, tA, tO, fE, fA, fO;
      if (p === 'nominal') {
        tE=j(375,75);  tA=Math.max(0.09,Math.min(0.21,j(0.15,0.03))); tO=j(375,60);
        fE=0.10; fA=0.10; fO=0.10;
      } else if (p === 'breach') {
        tE=j(87000,4000); tA=0.92; tO=j(615,30);
        fE=0.35; fA=0.28; fO=0.06;
      } else { /* mitigating */
        tE=j(400,50); tA=Math.max(0.12,Math.min(0.18,j(0.14,0.02))); tO=j(400,20);
        fE=0.22; fA=0.12; fO=0.18;
      }

      const L = (a,b,f) => a+(b-a)*f;
      const next = {
        edge:    Math.max(0,    L(m.edge,    tE, fE)),
        anomaly: Math.min(1, Math.max(0, L(m.anomaly, tA, fA))),
        origin:  Math.max(0,    L(m.origin,  tO, fO)),
      };
      metricsRef.current = next;
      setDisplayM({...next});
    }, 120);
    return () => clearInterval(loop);
  }, []);

  /* ── Attack ── */
  const launchAttack = () => {
    if (attacked) return;
    setAttacked(true);
    setPhase('breach');
    addEvent('ALERT: Volumetric surge detected. Edge ingestion spiked to 87,000+ req/s.', 'alert');
    setTimeout(()=>addEvent('SQS buffer auto-scaling. Absorbing attack volume.', 'alert'), 600);
    setTimeout(()=>addEvent('AI Isolation Forest: Anomaly score climbing past threshold (0.60).', 'alert'), 1400);
    setTimeout(()=>addEvent('Evaluating traffic distribution. Classifying malicious IP ranges…', 'alert'), 2200);
  };

  const resetSim = () => {
    if (phaseTimerRef.current) clearTimeout(phaseTimerRef.current);
    setAttacked(false); setPhase('nominal'); setNaclRules([]);
    metricsRef.current = {edge:375, anomaly:0.145, origin:372};
    addEvent('Simulation reset. Nominal baseline monitoring resumed.', 'info');
  };

  /* ── Display helpers ── */
  const fmtReq = n => {
    const r = Math.round(n);
    return r>=10000 ? `${(r/1000).toFixed(0)}k` : r>=1000 ? `${(r/1000).toFixed(1)}k` : String(r);
  };

  const edgePct    = Math.min(100, (displayM.edge/100000)*100);
  const originPct  = Math.min(100, (displayM.origin/100000)*100);
  const anomalyPct = Math.min(100, displayM.anomaly*100);
  const breaching  = displayM.anomaly >= 0.60;

  const phaseBarColor  = phase==='breach' ? TC.amberBar : TC.sage;
  const statusTextColor= phase==='nominal' ? '#78716c' : phase==='breach' ? TC.amber : TC.sage;
  const statusMsg = phase==='nominal'
    ? 'System Nominal. Forwarding clean traffic to origin server.'
    : phase==='breach'
    ? 'Anomalous surge detected. SQS Buffer expanding. AI evaluating…'
    : 'Threat Isolated. Boto3 NACL Rule Injected. Network Secured.';

  const protectionDot = phase==='breach' ? TC.amberBar : TC.sage;
  const protectionLabel = phase==='breach' ? 'Under Attack' : phase==='mitigating' ? 'Secured' : 'Protected';

  /* pipeline nodes */
  const pipelineNodes = [
    { icon:<GlobeIco/>,  label:'Open Internet',  sub:'Attack source',      state:'neutral' },
    { icon:<BoxIco/>,    label:'SQS Buffer',      sub:'Aegis Absorber',     state: phase==='breach'?'warn':phase==='mitigating'?'safe':'neutral' },
    { icon:<BrainIco/>,  label:'AI Engine',       sub:'Isolation Forest',   state: phase==='breach'?'warn':phase==='mitigating'?'safe':'neutral' },
    { icon:<NaclIco/>,   label:'VPC NACL',        sub:'AWS Firewall',       state: phase==='mitigating'?'safe':'neutral' },
    { icon:<ServerIco/>, label:'Origin Server',   sub:'Your server',        state: 'safe' },
  ];
  const nodeColors = {
    neutral: { border:'#e7e5e4', bg:'#fff',         icon:'#a8a29e' },
    warn:    { border:'#fde68a', bg:'#fffbeb',       icon:TC.amberBar },
    safe:    { border:'rgba(106,148,121,0.4)', bg:'rgba(106,148,121,0.05)', icon:TC.sage },
  };
  const connectorColor = (i) => {
    if (phase==='breach'    && i>=1 && i<=2) return '#fde68a';
    if (phase==='mitigating'&& i>=1 && i<=3) return 'rgba(106,148,121,0.4)';
    return '#e7e5e4';
  };

  return (
    <div style={{minHeight:'100vh', background:'#fafaf9'}}>

      {/* Dashboard nav */}
      <div className="fixed top-0 inset-x-0 z-40 bg-stone-50/97 backdrop-blur-md border-b border-stone-200">
        <div className="max-w-6xl mx-auto px-8 h-16 flex items-center justify-between">
          <div className="flex items-center gap-3 min-w-0">
            <div className="w-4 h-4 text-stone-700 flex-shrink-0"><ShieldIco/></div>
            <span className="text-sm font-semibold text-stone-900 flex-shrink-0">Aegis</span>
            <span className="w-px h-4 bg-stone-200 mx-1 flex-shrink-0"/>
            <span className="text-sm text-stone-500 font-mono truncate hidden sm:block">{domain}</span>
            <div className="flex items-center gap-1.5 flex-shrink-0">
              <span className="w-1.5 h-1.5 rounded-full" style={{background:protectionDot, animation:'blink 1.4s infinite', display:'inline-block'}}/>
              <span className="text-xs font-medium transition-colors duration-500" style={{color:protectionDot}}>{protectionLabel}</span>
            </div>
          </div>
          <div className="flex items-center gap-5">
            <button onClick={onBackToSite} className="text-sm text-stone-400 hover:text-stone-700 transition-colors hidden sm:block">
              ← Landing page
            </button>
            <div className="flex items-center gap-2">
              <div className="w-6 h-6 rounded-full bg-stone-200 flex items-center justify-center text-xs font-bold text-stone-700 flex-shrink-0">S</div>
              <span className="text-sm font-medium text-stone-700 hidden md:block">{userName}</span>
            </div>
          </div>
        </div>
      </div>

      <div className="pt-24 pb-20 max-w-6xl mx-auto px-8">

        {/* Page header */}
        <div className="mb-10 pt-2">
          <div className="text-xs uppercase tracking-widest text-stone-400 mb-2">Tenant Dashboard · Model A</div>
          <div className="flex items-end gap-4 flex-wrap">
            <h1 className="serif text-3xl font-medium text-stone-900">{domain}</h1>
            <span className="text-sm font-mono text-stone-400 border border-stone-200 rounded-sm px-2.5 py-1 bg-white mb-0.5">
              {tenId.slice(0,12)}…
            </span>
          </div>
          <p className="text-sm text-stone-400 mt-1.5">
            Ingress IP: <span className="font-mono">{ingressIp}</span>
            <span className="mx-2">·</span>
            CNAME → <span className="font-mono">{tenantData?.cname_target||'ingress.aegis-shield.net'}</span>
          </p>
        </div>

        {/* ── Metric Cards ── */}
        <div className="grid md:grid-cols-3 gap-5 mb-6">

          {/* Edge Ingestion */}
          <div className="card p-6">
            <div className="text-xs uppercase tracking-widest text-stone-400 mb-5">Edge Ingestion Rate</div>
            <div className="flex items-baseline gap-2 mb-1.5">
              <span className="serif text-4xl font-medium text-stone-900" style={{lineHeight:1,fontVariantNumeric:'tabular-nums'}}>
                {fmtReq(displayM.edge)}
              </span>
              <span className="text-sm text-stone-400">req/s</span>
            </div>
            <div className="text-xs mb-4 h-4 transition-colors duration-400" style={{color: phaseBarColor}}>
              {phase==='nominal' ? '↑ Nominal baseline (SQS buffer idle)'
               : phase==='breach' ? '↑↑ Surge absorbed by SQS buffer'
               : '↓ Attack traffic blocked by NACL'}
            </div>
            <div className="metric-bar">
              <div className="metric-bar-fill" style={{width:`${edgePct.toFixed(2)}%`, background: phaseBarColor}}/>
            </div>
            <div className="flex justify-between mt-1.5">
              <span className="text-xs text-stone-300 font-mono">0</span>
              <span className="text-xs text-stone-300 font-mono">100k req/s</span>
            </div>
          </div>

          {/* Anomaly Score — hero metric */}
          <div className="card p-6 transition-all duration-500"
            style={{
              borderColor: breaching ? '#fde68a' : '#e7e5e4',
              background:  breaching ? '#fffbeb' : '#fff',
            }}>
            <div className="text-xs uppercase tracking-widest text-stone-400 mb-5">AI Anomaly Score</div>
            <div className="flex items-baseline gap-2 mb-1.5">
              <span className="text-4xl font-mono font-medium transition-colors duration-300"
                style={{lineHeight:1, color: breaching ? '#92400e' : '#1c1917', fontVariantNumeric:'tabular-nums'}}>
                {displayM.anomaly.toFixed(3)}
              </span>
              <span className="text-sm text-stone-400">/ 1.00</span>
            </div>
            <div className="text-xs mb-4 h-4 transition-colors duration-300"
              style={{color: breaching ? '#92400e' : TC.sage}}>
              {breaching ? '⚠ Threshold breached (≥ 0.60)' : '✓ Within safe threshold (< 0.60)'}
            </div>
            {/* Bar with 0.60 threshold marker */}
            <div className="relative metric-bar">
              <div className="metric-bar-fill" style={{width:`${anomalyPct.toFixed(2)}%`, background: breaching ? TC.amberBar : TC.sage}}/>
              {/* Threshold tick */}
              <div className="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-0.5 h-3 rounded-full" style={{left:'60%', background:'#fbbf24', zIndex:2}}/>
            </div>
            <div className="flex justify-between mt-1.5">
              <span className="text-xs text-stone-300 font-mono">0.00</span>
              <span className="text-xs font-mono" style={{color:'#f59e0b', opacity:.7}}>0.60</span>
              <span className="text-xs text-stone-300 font-mono">1.00</span>
            </div>
          </div>

          {/* Origin Server Load */}
          <div className="card p-6">
            <div className="text-xs uppercase tracking-widest text-stone-400 mb-5">Origin Server Load</div>
            <div className="flex items-baseline gap-2 mb-1.5">
              <span className="serif text-4xl font-medium text-stone-900" style={{lineHeight:1,fontVariantNumeric:'tabular-nums'}}>
                {fmtReq(displayM.origin)}
              </span>
              <span className="text-sm text-stone-400">req/s</span>
            </div>
            <div className="text-xs mb-4 h-4" style={{color: TC.sage}}>
              {phase==='breach' ? '✓ Stable — shielded by Aegis buffer' : '✓ Stable — clean traffic only'}
            </div>
            <div className="metric-bar">
              <div className="metric-bar-fill" style={{width:`${originPct.toFixed(2)}%`, background: TC.sage}}/>
            </div>
            <div className="flex justify-between mt-1.5">
              <span className="text-xs text-stone-300 font-mono">0</span>
              <span className="text-xs text-stone-300 font-mono">100k req/s</span>
            </div>
          </div>

        </div>

        {/* ── Live Pipeline ── */}
        <div className="card p-6 mb-5">
          <div className="text-xs uppercase tracking-widest text-stone-400 mb-6">Live Traffic Pipeline</div>
          <div className="flex items-center">
            {pipelineNodes.map((node,i) => {
              const c = nodeColors[node.state];
              return (
                <React.Fragment key={i}>
                  <div className="flex flex-col items-center gap-2 flex-shrink-0" style={{minWidth:'72px'}}>
                    <div className="w-10 h-10 rounded-full flex items-center justify-center border-2 transition-all duration-600"
                      style={{borderColor:c.border, background:c.bg}}>
                      <div className="w-4 h-4 transition-colors duration-500" style={{color:c.icon}}>{node.icon}</div>
                    </div>
                    <div className="text-center" style={{maxWidth:'72px'}}>
                      <div className="text-xs font-medium text-stone-700 leading-tight">{node.label}</div>
                      <div className="text-xs text-stone-400 leading-tight">{node.sub}</div>
                    </div>
                  </div>
                  {i<pipelineNodes.length-1&&(
                    <div className="flex-1 mx-2 h-px transition-all duration-700" style={{background:connectorColor(i)}}/>
                  )}
                </React.Fragment>
              );
            })}
          </div>
          {/* Phase sub-label */}
          <div className="mt-6 pt-5 border-t border-stone-100 flex items-center gap-2">
            <span className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{background:statusTextColor, animation:'blink 1.4s infinite', display:'inline-block'}}/>
            <span className="text-xs transition-colors duration-400 leading-relaxed" style={{color:statusTextColor}}>{statusMsg}</span>
          </div>
        </div>

        {/* ── Stress Test ── */}
        <div className="card p-6 mb-5">
          <div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4 mb-6">
            <div>
              <div className="text-xs uppercase tracking-widest text-stone-400 mb-1.5">Stress Test Network</div>
              <p className="text-sm text-stone-500 max-w-lg">
                Simulate a volumetric DDoS attack to demonstrate the full Model A mitigation pipeline — from SQS absorption to Isolation Forest detection to Boto3 NACL injection.
              </p>
            </div>
            <div className="flex items-center gap-3 flex-shrink-0">
              <button onClick={launchAttack} disabled={attacked}
                className="text-sm font-medium px-5 py-2.5 border rounded-sm transition-all duration-200 flex-shrink-0"
                style={{
                  borderColor: phase==='mitigating' ? '#d6d3d1' : attacked&&phase==='breach' ? '#fde68a' : '#1c1917',
                  color:       phase==='mitigating' ? '#a8a29e'  : attacked&&phase==='breach' ? '#92400e' : '#1c1917',
                  background:  phase==='breach'     ? '#fffbeb'  : 'transparent',
                  cursor:      attacked ? 'not-allowed' : 'pointer',
                }}>
                {phase==='breach'     ? 'Attack in progress…'
                 : phase==='mitigating' ? '✓ Threat neutralized'
                 : 'Launch Volumetric Attack'}
              </button>
              {attacked && (
                <button onClick={resetSim} className="text-sm text-stone-400 hover:text-stone-700 transition-colors underline underline-offset-2 flex-shrink-0">
                  Reset
                </button>
              )}
            </div>
          </div>

          {/* Phase timeline */}
          <div className="grid grid-cols-3 gap-3">
            {[
              { label:'Phase 1 · Nominal', active: phase==='nominal', done: phase!=='nominal',
                detail: 'Edge ~375 req/s · Anomaly ~0.15 · Origin stable' },
              { label:'Phase 2 · Volumetric Breach', active: phase==='breach', done: phase==='mitigating',
                detail: 'Edge spikes 87k+ · Anomaly → 0.92 · SQS buffer absorbs' },
              { label:'Phase 3 · Autonomous Mitigation', active: phase==='mitigating', done: false,
                detail: 'NACL injected · Anomaly resets · Origin remains stable' },
            ].map((p,i)=>(
              <div key={i} className="border border-stone-100 rounded-sm p-3.5 transition-all duration-500"
                style={{
                  borderColor: p.active ? (i===1?'#fde68a':'rgba(106,148,121,0.4)') : p.done ? 'rgba(106,148,121,0.25)' : '#f5f5f4',
                  background:  p.active ? (i===1?'#fffbeb':'rgba(106,148,121,0.04)') : 'transparent',
                }}>
                <div className="flex items-center gap-2 mb-1.5">
                  <span className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{
                    background: p.done ? TC.sage : p.active ? (i===1?TC.amberBar:TC.sage) : '#d6d3d1',
                    animation: p.active ? 'blink 1.4s infinite' : 'none',
                    display:'inline-block',
                  }}/>
                  <span className="text-xs font-medium" style={{
                    color: p.done ? TC.sage : p.active ? (i===1?'#92400e':TC.sage) : '#a8a29e',
                  }}>{p.label}</span>
                </div>
                <p className="text-xs text-stone-400 leading-relaxed">{p.detail}</p>
              </div>
            ))}
          </div>
        </div>

        {/* ── NACL Rules (mitigating only) ── */}
        {naclRules.length > 0 && (
          <div className="card overflow-hidden mb-5 fade-up">
            <div className="px-5 py-3.5 border-b border-stone-100 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <span className="text-xs uppercase tracking-widest text-stone-500 font-medium">Boto3 NACL Rules Injected</span>
                <span className="text-xs text-stone-300 font-mono hidden sm:block">aws_infrastructure/aegis_nacl.py</span>
              </div>
              <span className="flex items-center gap-1.5 text-xs font-medium" style={{color:TC.sage}}>
                <span className="w-1.5 h-1.5 rounded-full" style={{background:TC.sage,animation:'blink 1.4s infinite',display:'inline-block'}}/>
                Active
              </span>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full">
                <thead>
                  <tr className="border-b border-stone-100">
                    {['Rule #','Action','Source CIDR','Protocol','Direction','Hits'].map(h=>(
                      <th key={h} className="px-5 py-2.5 text-left text-xs text-stone-400 font-medium uppercase tracking-wide whitespace-nowrap">{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {naclRules.map((r,i)=>(
                    <tr key={i} className="border-b border-stone-50 hover:bg-stone-50 transition-colors">
                      <td className="px-5 py-3 text-xs font-mono text-stone-600">{r.rule}</td>
                      <td className="px-5 py-3 text-xs font-mono font-semibold" style={{color:'#9a3412'}}>DENY</td>
                      <td className="px-5 py-3 text-xs font-mono text-stone-600">{r.cidr}</td>
                      <td className="px-5 py-3 text-xs font-mono text-stone-400">{r.proto}</td>
                      <td className="px-5 py-3 text-xs font-mono text-stone-400">{r.dir}</td>
                      <td className="px-5 py-3 text-xs font-mono text-stone-600">{r.hits}</td>
                    </tr>
                  ))}
                  <tr>
                    <td colSpan="6" className="px-5 py-3 text-xs text-stone-400 font-mono">
                      + 844 additional rules auto-injected · Rule 32766: Allow all (legitimate traffic baseline)
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        )}

        {/* ── Event Log ── */}
        <div className="card overflow-hidden">
          <div className="px-5 py-3.5 border-b border-stone-100 flex items-center justify-between">
            <span className="text-xs uppercase tracking-widest text-stone-500 font-medium">Event Log</span>
            <span className="text-xs text-stone-300 font-mono">{events.length} entries</span>
          </div>
          <div style={{maxHeight:'260px', overflowY:'auto'}}>
            {events.length === 0 && (
              <div className="px-5 py-5 text-xs text-stone-300 font-mono">No events yet.</div>
            )}
            {events.map((e,i) => (
              <div key={e.id} className={`flex items-start gap-4 px-5 py-3 ${i<events.length-1?'border-b border-stone-50':''}`}>
                <span className="text-xs font-mono text-stone-300 flex-shrink-0 mt-0.5 tabular-nums">{e.time}</span>
                <span className="text-xs leading-relaxed transition-colors" style={{
                  color: e.type==='alert'   ? '#92400e'
                       : e.type==='success' ? TC.sage
                       : '#78716c'
                }}>{e.msg}</span>
              </div>
            ))}
          </div>
        </div>

      </div>
    </div>
  );
};

/* ═══════════════════════════════════════════════════════════
   APP ROOT
   ═══════════════════════════════════════════════════════════ */
const App = () => {
  const [isLoggedIn,  setIsLoggedIn]  = useState(false);
  const [modal,       setModal]       = useState(null);
  const [view,        setView]        = useState('landing');
  const [dashTenant,  setDashTenant]  = useState(null);

  const signIn      = useCallback(()=>{ setIsLoggedIn(true); setModal(null); }, []);
  const signOut     = useCallback(()=>{ setIsLoggedIn(false); setView('landing'); window.scrollTo(0,0); }, []);
  const openSignIn  = useCallback(()=>setModal('signin'), []);
  const closeModal  = useCallback(()=>setModal(null), []);
  const goProtect   = useCallback(()=>{ setView('onboarding');  window.scrollTo(0,0); }, []);
  const goLanding   = useCallback(()=>{ setView('landing');     window.scrollTo(0,0); }, []);
  const goDashboard = useCallback(()=>{ setView('dashboard');   window.scrollTo(0,0); }, []);

  /* Called by Onboarding when DNS verified — auto-logins and jumps to dashboard */
  const handleOnboardingSuccess = useCallback((data) => {
    setDashTenant(data);
    setIsLoggedIn(true);
    setView('dashboard');
    window.scrollTo(0,0);
  }, []);

  return (
    <div className="bg-stone-50">
      {modal==='signin' && <SignInModal onClose={closeModal} onSignIn={signIn}/>}

      {/* Main Nav — hidden on dashboard (dashboard has its own header) */}
      {view !== 'dashboard' && (
        <Nav
          isLoggedIn={isLoggedIn}
          onSignIn={openSignIn}
          onSignOut={signOut}
          onProtect={goProtect}
          onDashboard={goDashboard}
        />
      )}

      {view === 'landing' && (
        <>
          <Hero     onProtect={goProtect}/>
          <Stats/>
          <HowItWorks/>
          <Simulator/>
          <Research/>
          <CTA      onProtect={goProtect}/>
          <Footer   onSignIn={openSignIn} onProtect={goProtect}/>
        </>
      )}

      {view === 'onboarding' && (
        <Onboarding onBack={goLanding} onSuccess={handleOnboardingSuccess}/>
      )}

      {view === 'dashboard' && (
        <Dashboard
          tenantData={dashTenant}
          userName="Somraj Sarkar"
          onBackToSite={goLanding}
        />
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
