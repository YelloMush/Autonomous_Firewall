<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aegis — Deploy enterprise AI defense directly into your AWS VPC.</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;}
  :root{
    --bg-app:#fafaf9; --bg-surface:#ffffff; --bg-subtle:#f5f5f4;
    --text-primary:#1c1917; --text-muted:#78716c; --text-faint:#a8a29e;
    --border:#e7e5e4; --border-mid:#d6d3d1;
  }
  html.dark{
    --bg-app:#0c0a09; --bg-surface:#1c1917; --bg-subtle:#292524;
    --text-primary:#e7e5e4; --text-muted:#a8a29e; --text-faint:#78716c;
    --border:#292524; --border-mid:#44403c;
  }
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg-app);color:var(--text-primary);margin:0;transition:background .2s,color .2s;}
  .serif{font-family:'Playfair Display',Georgia,serif;}
  h1,h2,h3{font-family:'Playfair Display',Georgia,serif;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulseRing{0%{transform:scale(.85);opacity:.7}100%{transform:scale(2.4);opacity:0}}
  @keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .fade-up{animation:fadeUp .6s ease-out both;}
  .modal-bd{animation:fadeIn .18s ease-out both;}
  .modal-cd{animation:slideUp .22s ease-out both;}
  .pipe-dot{position:absolute;border-radius:50%;pointer-events:none;}
  ::selection{background:var(--border);}
  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-track{background:var(--bg-app);}
  ::-webkit-scrollbar-thumb{background:var(--border-mid);border-radius:2px;}
  input:focus{outline:none;}
  .fi{width:100%;border:1px solid var(--border);padding:12px 14px;font-size:14px;font-family:inherit;background:var(--bg-surface);color:var(--text-primary);border-radius:2px;transition:border-color .15s;}
  .fi:focus{border-color:var(--text-muted);}
  .fi:disabled{background:var(--bg-app);color:var(--text-faint);}
  .pb{display:flex;width:100%;padding:12px;font-size:14px;font-weight:500;background:var(--text-primary);color:var(--bg-app);border:none;border-radius:2px;cursor:pointer;transition:background .15s;font-family:inherit;align-items:center;justify-content:center;gap:8px;}
  .pb:hover:not(:disabled){opacity:.82;}
  .pb:disabled{background:var(--border-mid);cursor:not-allowed;}
  .pbo{background:transparent;color:var(--text-primary);border:1px solid var(--border);}
  .pbo:hover:not(:disabled){background:var(--bg-subtle);}
  .card{border:1px solid var(--border);border-radius:2px;background:var(--bg-surface);}
  .metric-bar{position:relative;height:2px;background:var(--bg-subtle);border-radius:9999px;}
  .metric-bar-fill{position:absolute;height:100%;border-radius:9999px;transition:width .12s linear;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ── API base ── */
const API_BASE = 'http://localhost:8001';

/* ── Brand colours (theme-invariant — status/accent colors read the same in light and dark) ── */
const TC = { normal:'#7499B4', attack:'#B36A55', sage:'#6A9479', amber:'#92400e', amberBar:'#b45309' };

/* ── Dark mode ── */
function useDarkMode() {
  const [dark, setDark] = useState(() => localStorage.getItem('aegis-web-theme') === 'dark');
  useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
    localStorage.setItem('aegis-web-theme', dark ? 'dark' : 'light');
  }, [dark]);
  return [dark, () => setDark(d => !d)];
}

const ThemeToggle = ({ dark, onToggle, cls = '' }) => (
  <button onClick={onToggle} aria-label="Toggle theme"
    className={`w-8 h-8 flex items-center justify-center rounded-sm text-stone-400 hover:text-stone-700 dark:hover:text-stone-200 hover:bg-stone-100 dark:hover:bg-stone-800 transition-colors ${cls}`}>
    {dark ? '☀' : '☽'}
  </button>
);

/* ─────────────────── ICONS ─────────────────── */
const Ico = ({d,cls='w-full h-full',sw=1.5,fill='none'}) => (
  <svg className={cls} viewBox="0 0 24 24" fill={fill} stroke="currentColor"
    strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
    {typeof d==='string'?<path d={d}/>:d}
  </svg>
);
const ShieldIco  = ({cls}) => <Ico cls={cls} d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>;
const GlobeIco   = ({cls}) => <Ico cls={cls} d={<><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></>}/>;
const ServerIco  = ({cls}) => <Ico cls={cls} d={<><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></>}/>;
const BrainIco   = ({cls}) => <Ico cls={cls} d={<><path d="M9.5 2A2.5 2.5 0 0 0 7 4.5v.25A2.5 2.5 0 0 0 4.5 7 2.5 2.5 0 0 0 2 9.5 2.5 2.5 0 0 0 4.5 12H5"/><path d="M14.5 2A2.5 2.5 0 0 1 17 4.5v.25A2.5 2.5 0 0 1 19.5 7 2.5 2.5 0 0 1 22 9.5 2.5 2.5 0 0 1 19.5 12H19"/><path d="M12 12v9M9 18h6M9 15h6"/><circle cx="12" cy="7" r="2.5"/></>}/>;
const BoxIco     = ({cls}) => <Ico cls={cls} d={<><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></>}/>;
const ArrowIco   = ({cls='w-3.5 h-3.5'}) => <Ico cls={cls} d="M5 12h14M12 5l7 7-7 7"/>;
const BackIco    = ({cls='w-3.5 h-3.5'}) => <Ico cls={cls} d="M19 12H5M12 5l-7 7 7 7"/>;
const CloseIco   = ({cls}) => <Ico cls={cls} d="M18 6L6 18M6 6l12 12"/>;
const CopyIco    = ({cls}) => <Ico cls={cls} d={<><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></>}/>;
const ChevIco    = ({cls='w-3.5 h-3.5'}) => <Ico cls={cls} d="M6 9l6 6 6-6"/>;
const DnsIco     = ({cls}) => <Ico cls={cls} d={<><path d="M4 5h16M4 12h16M4 19h16"/><circle cx="9" cy="5" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="9" cy="19" r="1" fill="currentColor" stroke="none"/></>}/>;
const GithubIco  = ({cls}) => <Ico cls={cls} d={<path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>}/>;
const NaclIco    = ({cls}) => <Ico cls={cls} d={<><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/></>}/>;

/* ─────────────────── MODAL SHELL ─────────────────── */
const Modal = ({onClose,children}) => (
  <div className="modal-bd fixed inset-0 z-50 flex items-center justify-center p-4"
    style={{background:'rgba(28,25,23,0.45)',backdropFilter:'blur(4px)'}}
    onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal-cd bg-stone-50 dark:bg-stone-900 border border-stone-200 dark:border-stone-800 rounded-sm w-full max-w-md relative max-h-[90vh] overflow-y-auto">
      {children}
    </div>
  </div>
);

/* ─────────────────── AUTH (real backend — /api/auth/* on the FastAPI Aegis Core) ───────────────────
   Accounts are stored server-side in the shared SQLite database, so a user who signs up here can log
   straight into the desktop client (and vice versa) without creating a second account. localStorage is
   only used to remember which already-authenticated user this browser last was, for UI convenience. */
const AUTH_API_BASE = 'http://localhost:8000';
const AUTH_SESSION_KEY = 'aegis-auth-session';
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/;

const NETWORK_ERROR = { ok:false, error:'Could not reach the Aegis server. Is the backend running on :8000?' };

async function apiSignUp({ name, email, password, tier }) {
  try {
    const res = await fetch(`${AUTH_API_BASE}/api/auth/signup`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password, tier }),
    });
    return await res.json();
  } catch (_) { return NETWORK_ERROR; }
}
async function apiSignIn({ email, password }) {
  try {
    const res = await fetch(`${AUTH_API_BASE}/api/auth/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    return await res.json();
  } catch (_) { return NETWORK_ERROR; }
}
async function apiLookup(email) {
  try {
    const res = await fetch(`${AUTH_API_BASE}/api/auth/lookup?email=${encodeURIComponent(email)}`);
    const data = await res.json();
    return !!data.exists;
  } catch (_) { return false; }
}

function useAuth() {
  const [user, setUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem(AUTH_SESSION_KEY)); } catch (_) { return null; }
  });

  const persist = (u) => {
    setUser(u);
    try { localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(u)); } catch (_) {}
  };

  const signUp = useCallback(async ({ name, email, password, tier }) => {
    const result = await apiSignUp({ name, email, password, tier });
    if (result.ok) persist(result.user);
    return result;
  }, []);

  const signIn = useCallback(async ({ email, password }) => {
    const result = await apiSignIn({ email, password });
    if (result.ok) persist(result.user);
    return result;
  }, []);

  const signOut = useCallback(() => {
    try { localStorage.removeItem(AUTH_SESSION_KEY); } catch (_) {}
    setUser(null);
  }, []);

  return { user, signIn, signUp, signOut, lookupEmail: apiLookup };
}

/* ─────────────────── AUTH MODAL — tabs, live existing-email detection, tier selection ─────────────────── */
const AuthModal = ({ onClose, onAuthed, lookupEmail, signIn, signUp }) => {
  const [tab, setTab] = useState('signin');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [name, setName] = useState('');
  const [tier, setTier] = useState('shield');
  const [error, setError] = useState('');
  const [switched, setSwitched] = useState(null);
  const [busy, setBusy] = useState(false);
  const [knownUser, setKnownUser] = useState(false);

  useEffect(() => {
    const trimmed = email.trim();
    if (!EMAIL_RE.test(trimmed)) { setKnownUser(false); return; }
    let cancelled = false;
    const t = setTimeout(() => {
      lookupEmail(trimmed).then(exists => { if (!cancelled) setKnownUser(exists); });
    }, 250);
    return () => { cancelled = true; clearTimeout(t); };
  }, [email, lookupEmail]);

  useEffect(() => {
    if (!EMAIL_RE.test(email.trim())) { setSwitched(null); return; }
    if (knownUser && tab !== 'signin') { setTab('signin'); setSwitched('Welcome back — this email already has an account.'); }
    else if (!knownUser && tab !== 'signup') { setTab('signup'); setSwitched('New email — let’s set up your account.'); }
    else setSwitched(null);
  }, [knownUser]); // eslint-disable-line

  const submit = async (e) => {
    e.preventDefault();
    setError('');
    if (!EMAIL_RE.test(email.trim())) { setError('Enter a valid email address.'); return; }
    setBusy(true);
    const result = tab === 'signin' ? await signIn({ email, password }) : await signUp({ name, email, password, tier });
    setBusy(false);
    if (!result.ok) { setError(result.error); return; }
    onAuthed?.();
    onClose();
  };

  return (
    <Modal onClose={onClose}>
      <button onClick={onClose} className="absolute top-5 right-5 w-5 h-5 text-stone-400 hover:text-stone-700 dark:hover:text-stone-200 transition-colors"><CloseIco/></button>
      <div className="flex border-b border-stone-200 dark:border-stone-800">
        {['signin','signup'].map(t => (
          <button key={t} onClick={()=>setTab(t)}
            className={`flex-1 py-4 text-sm font-medium transition-colors border-b-2 ${tab===t?'border-stone-900 dark:border-stone-100 text-stone-900 dark:text-stone-100':'border-transparent text-stone-400 hover:text-stone-600 dark:hover:text-stone-300'}`}>
            {t==='signin' ? 'Sign In' : 'Create Account'}
          </button>
        ))}
      </div>
      <form onSubmit={submit} className="p-8">
        <div className="flex items-center gap-2 mb-5"><div className="w-4 h-4 text-stone-700 dark:text-stone-300"><ShieldIco/></div><span className="text-sm font-semibold text-stone-900 dark:text-stone-100">Aegis</span></div>
        <h2 className="serif text-2xl font-medium text-stone-900 dark:text-stone-100 mb-1">{tab==='signin' ? 'Welcome back.' : 'Create your account.'}</h2>
        <p className="text-sm text-stone-500 dark:text-stone-400 mb-6">{tab==='signin' ? 'Sign in to your Aegis account.' : 'Choose a tier and you’re in.'}</p>

        {switched && <div className="text-xs text-amber-700 bg-amber-50 dark:bg-amber-900/20 dark:text-amber-400 border border-amber-200 dark:border-amber-800 rounded-sm px-3 py-2 mb-5">{switched}</div>}

        <div className="mb-4">
          <label className="block text-xs text-stone-500 dark:text-stone-400 mb-1.5">Email address</label>
          <input type="email" className="fi" placeholder="you@company.com" value={email} onChange={e=>setEmail(e.target.value)} autoFocus disabled={busy}/>
        </div>

        {tab === 'signup' && (
          <div className="mb-4">
            <label className="block text-xs text-stone-500 dark:text-stone-400 mb-1.5">Full name</label>
            <input className="fi" placeholder="Ada Lovelace" value={name} onChange={e=>setName(e.target.value)} disabled={busy}/>
          </div>
        )}

        <div className="mb-4">
          <label className="block text-xs text-stone-500 dark:text-stone-400 mb-1.5">Password</label>
          <input type="password" className="fi" placeholder={tab==='signup' ? 'At least 6 characters' : '••••••••'} value={password} onChange={e=>setPassword(e.target.value)} disabled={busy}/>
        </div>

        {tab === 'signup' && (
          <div className="mb-6">
            <label className="block text-xs text-stone-500 dark:text-stone-400 mb-2">Tier</label>
            <div className="grid grid-cols-2 gap-2">
              {[
                { id:'shield', label:'Aegis Shield', desc:'Individual · edge proxy' },
                { id:'enterprise', label:'Aegis Enterprise', desc:'Private VPC · IaC' },
              ].map(o=>(
                <button key={o.id} type="button" onClick={()=>setTier(o.id)}
                  className={`text-left rounded-sm p-3 border transition-colors ${tier===o.id?'border-stone-900 dark:border-stone-100 bg-stone-50 dark:bg-stone-800':'border-stone-200 dark:border-stone-700 hover:bg-stone-50 dark:hover:bg-stone-800'}`}>
                  <div className="text-xs font-semibold text-stone-800 dark:text-stone-200">{o.label}</div>
                  <div className="text-xs text-stone-400 dark:text-stone-500">{o.desc}</div>
                </button>
              ))}
            </div>
          </div>
        )}

        {error && <div className="text-xs text-red-600 dark:text-red-400 mb-4">{error}</div>}

        <button type="submit" className="pb" disabled={busy || !email || !password}>
          {busy ? (tab==='signin' ? 'Signing in…' : 'Creating account…') : (tab==='signin' ? 'Sign in' : 'Create account')}
        </button>
      </form>
    </Modal>
  );
};

/* ─────────────────── NAV ─────────────────── */
const initials = (name) => name.trim().split(/\s+/).slice(0,2).map(p=>p[0]?.toUpperCase()).join('') || '?';

const Nav = ({user,onSignIn,onSignOut,onLogoClick,onDashboard,dark,onToggleDark}) => {
  const [solid,setSolid]       = useState(false);
  const [acctOpen,setAcctOpen] = useState(false);
  useEffect(()=>{
    const h=()=>setSolid(window.scrollY>50);
    window.addEventListener('scroll',h); return ()=>window.removeEventListener('scroll',h);
  },[]);
  return (
    <nav className={`fixed top-0 inset-x-0 z-40 transition-all duration-300 ${solid?'bg-stone-50/96 dark:bg-stone-950/96 backdrop-blur-md border-b border-stone-200 dark:border-stone-800':'bg-transparent'}`}>
      <div className="max-w-6xl mx-auto px-8 h-16 flex items-center justify-between">
        <button onClick={onLogoClick} className="flex items-center gap-2.5">
          <div className="w-4 h-4 text-stone-700 dark:text-stone-300"><ShieldIco/></div>
          <span className="text-sm font-semibold tracking-tight text-stone-900 dark:text-stone-100">Aegis</span>
        </button>
        <div className="hidden md:flex gap-8 text-sm text-stone-500 dark:text-stone-400">
          {[['#how','How it works'],['#simulator','Simulator'],['#research','Research']].map(([h,l])=>(
            <a key={h} href={h} className="hover:text-stone-900 dark:hover:text-stone-100 transition-colors">{l}</a>
          ))}
        </div>
        <div className="flex items-center gap-3">
          <ThemeToggle dark={dark} onToggle={onToggleDark}/>
          {user ? (
            <>
              <div className="relative">
                <button onClick={()=>setAcctOpen(o=>!o)} className="hidden sm:flex items-center gap-2 text-sm text-stone-600 dark:text-stone-300 hover:text-stone-900 dark:hover:text-stone-100 transition-colors py-1 px-1 rounded-sm">
                  <div className="w-6 h-6 rounded-full bg-stone-200 dark:bg-stone-700 flex items-center justify-center text-xs font-bold text-stone-700 dark:text-stone-200 flex-shrink-0">{initials(user.name)}</div>
                  <span className="font-medium">{user.name}</span>
                  <ChevIco cls="w-3.5 h-3.5 text-stone-400"/>
                </button>
                {acctOpen && (
                  <>
                    <div className="fixed inset-0 z-30" onClick={()=>setAcctOpen(false)}/>
                    <div className="absolute right-0 top-full mt-1 w-52 bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 rounded-sm shadow-sm z-40 overflow-hidden">
                      <div className="px-4 py-3 border-b border-stone-100 dark:border-stone-800">
                        <div className="text-xs font-semibold text-stone-800 dark:text-stone-200">{user.name}</div>
                        <div className="text-xs text-stone-400 mt-0.5">{user.email}</div>
                        <div className="text-xs text-stone-400 mt-1">{user.tier==='enterprise'?'Aegis Enterprise':'Aegis Shield'}</div>
                      </div>
                      <button onClick={()=>{setAcctOpen(false);onSignOut();}} className="block w-full text-left px-4 py-2.5 text-sm text-stone-600 dark:text-stone-300 hover:bg-stone-50 dark:hover:bg-stone-800 transition-colors">Sign out</button>
                    </div>
                  </>
                )}
              </div>
              <button onClick={onDashboard} className="text-sm font-medium bg-stone-900 dark:bg-stone-100 text-stone-50 dark:text-stone-900 px-4 py-2 rounded-sm hover:bg-stone-700 dark:hover:bg-stone-300 transition-colors">Go to Dashboard</button>
            </>
          ) : (
            <>
              <button onClick={onSignIn} className="hidden sm:block text-sm text-stone-500 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-100 transition-colors">Sign in</button>
              <a href="download.html" className="text-sm font-medium bg-stone-900 dark:bg-stone-100 text-stone-50 dark:text-stone-900 px-4 py-2 rounded-sm hover:bg-stone-700 dark:hover:bg-stone-300 transition-colors">Download Aegis for PC</a>
            </>
          )}
        </div>
      </div>
    </nav>
  );
};

/* ─────────────────── HERO ─────────────────── */
const Hero = ({user,onDashboard}) => (
  <section id="hero" className="pt-36 pb-20 max-w-6xl mx-auto px-8">
    <div className="max-w-2xl fade-up">
      <div className="text-xs uppercase tracking-widest text-stone-400 mb-7">AI-Powered · Autonomous · Two Ways to Deploy</div>
      <h1 className="text-6xl md:text-7xl font-medium leading-tight tracking-tight text-stone-900 dark:text-stone-100 mb-7">
        Stop DDoS attacks<br/><em className="text-stone-500 dark:text-stone-400">before they reach your server.</em>
      </h1>
      <p className="text-lg text-stone-500 dark:text-stone-400 leading-loose font-light mb-10 max-w-lg">Aegis tells a legitimate traffic surge apart from a botnet flood in real time, using unsupervised anomaly detection — then blocks the attack automatically. Run it as a managed edge proxy in minutes, or deploy it as IaC inside your own AWS VPC.</p>
      <div className="flex flex-wrap gap-3">
        {user ? (
          <button onClick={onDashboard} className="inline-flex items-center gap-2 text-sm font-medium bg-stone-900 dark:bg-stone-100 text-stone-50 dark:text-stone-900 px-6 py-3 rounded-sm hover:bg-stone-700 dark:hover:bg-stone-300 transition-colors">
            Go to Dashboard <ArrowIco/>
          </button>
        ) : (
          <a href="download.html" className="inline-flex items-center gap-2 text-sm font-medium bg-stone-900 dark:bg-stone-100 text-stone-50 dark:text-stone-900 px-6 py-3 rounded-sm hover:bg-stone-700 dark:hover:bg-stone-300 transition-colors">
            Download Aegis for PC <ArrowIco/>

/* ─────────────────── SIMULATOR ─────────────────── */
const PH = {IDLE:'idle',ATTACK:'attack'};
const Simulator = () => {
  const [phase,setPhase]    = useState(PH.IDLE);
  const [dots,setDots]      = useState([]);
  const [disp,setDisp]      = useState({aegisRate:400,clientRate:400,absorbed:0});
  const phRef=useRef(PH.IDLE),dotId=useRef(0),raf=useRef(null),ts0=useRef(null);
  const cleanT=useRef(0),redT=useRef(0),dispT=useRef(0);
  const aegisRef=useRef(400),absRef=useRef(0);
  useEffect(()=>{phRef.current=phase;},[phase]);
  useEffect(()=>{
    const loop=ts=>{
      if(!ts0.current){ts0.current=ts;raf.current=requestAnimationFrame(loop);return;}
      const dt=Math.min(ts-ts0.current,50);ts0.current=ts;
      cleanT.current+=dt;redT.current+=dt;dispT.current+=dt;
      const p=phRef.current,isAtk=p===PH.ATTACK;
      setDots(prev=>{
        let nx=[...prev];
        if(cleanT.current>=650){cleanT.current=0;nx.push({id:dotId.current++,x:2,y:50+Math.random()*28,speed:11,color:TC.normal,maxX:97,opacity:1,size:6});}
        if(isAtk&&redT.current>=55){redT.current=0;nx.push({id:dotId.current++,x:2,y:44+Math.random()*36,speed:22+Math.random()*12,color:TC.attack,maxX:28+Math.random()*36,opacity:1,size:8});}
        nx=nx.map(d=>d.x>=d.maxX?{...d,opacity:d.opacity-0.055}:{...d,x:d.x+d.speed*dt/1000});
        return nx.filter(d=>d.opacity>0.02&&d.x<102);
      });
      aegisRef.current+=((isAtk?50000:400)-aegisRef.current)*0.045;
      if(isAtk) absRef.current=Math.min(absRef.current+dt*45,9999999);
      if(dispT.current>=250){dispT.current=0;setDisp({aegisRate:Math.round(aegisRef.current),clientRate:397+Math.round(Math.random()*9),absorbed:Math.round(absRef.current)});}
      raf.current=requestAnimationFrame(loop);
    };
    raf.current=requestAnimationFrame(loop);
    return()=>{cancelAnimationFrame(raf.current);ts0.current=null;};
  },[]);
  const simulate=()=>{if(phase===PH.ATTACK)return;absRef.current=0;setPhase(PH.ATTACK);};
  const reset=()=>{setPhase(PH.IDLE);setDots([]);aegisRef.current=400;absRef.current=0;setDisp({aegisRate:400,clientRate:400,absorbed:0});};
  const isAtk=phase===PH.ATTACK;
  const fmt=n=>n>=1000?`${(n/1000).toFixed(n>9999?0:1)}k`:String(n);
  return (
    <section id="simulator" className="bg-white dark:bg-stone-900 border-y border-stone-200 dark:border-stone-800 py-24">
      <div className="max-w-6xl mx-auto px-8">
        <div className="mb-12">
          <div className="text-xs uppercase tracking-widest text-stone-400 mb-4">Live Demonstration</div>
          <h2 className="text-4xl md:text-5xl font-medium text-stone-900 dark:text-stone-100 leading-tight tracking-tight mb-4 max-w-xl">Your server never feels the storm.</h2>
          <p className="text-stone-500 dark:text-stone-400 text-base leading-relaxed max-w-xl">Simulate a volumetric attack against an Aegis-protected origin. Watch the SQS buffer absorb the flood and the AI core neutralise it in real time — while the origin server remains completely uninterrupted.</p>
        </div>
        <div className="relative rounded-sm overflow-hidden mb-3" style={{height:'230px',border:'1px solid var(--border)'}}>
          <div className="absolute inset-0 flex pointer-events-none">
            <div style={{width:'22%',borderRight:'1px solid var(--border)',background:'var(--bg-surface)'}}/>
            <div style={{width:'56%',background:isAtk?'rgba(106,148,121,0.05)':'transparent',borderRight:`1px solid ${isAtk?'rgba(106,148,121,0.35)':'var(--border)'}`,transition:'background .9s,border-color .9s'}}/>
            <div style={{width:'22%',background:'var(--bg-surface)'}}/>
          </div>
          <div className="absolute top-0 inset-x-0 flex pointer-events-none" style={{zIndex:10}}>
            {[{w:'22%',icon:<GlobeIco/>,label:'Open Internet'},{w:'56%',icon:<ShieldIco/>,label:'Aegis Cloud Shield',active:isAtk},{w:'22%',icon:<ServerIco/>,label:'Your Origin',safe:isAtk}].map((n,i)=>(
              <div key={i} style={{width:n.w}} className="flex flex-col items-center pt-5 gap-1">
                <div className="w-5 h-5" style={{color:n.active?TC.sage:n.safe?TC.sage:'#a8a29e',transition:'color .7s'}}>{n.icon}</div>
                <div style={{fontSize:'10px',letterSpacing:'0.08em',textTransform:'uppercase',fontWeight:n.active||n.safe?600:400,color:n.active?TC.sage:n.safe?TC.sage:'#a8a29e',transition:'color .7s'}}>{n.safe&&isAtk?'✓ Stable':n.label}</div>
              </div>
            ))}
          </div>
          <div className="absolute inset-0 pointer-events-none" style={{zIndex:20}}>
            {dots.map(d=><div key={d.id} className="pipe-dot" style={{left:`${d.x}%`,top:`${d.y}%`,width:`${d.size}px`,height:`${d.size}px`,background:d.color,opacity:d.opacity,transform:'translateY(-50%)'}}/>)}
          </div>
        </div>
        <div className="flex flex-wrap items-center gap-6 mb-8 text-xs text-stone-400">
          <div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full" style={{background:TC.normal,display:'inline-block'}}/>Legitimate traffic</div>
          {isAtk&&<div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full" style={{background:TC.attack,display:'inline-block'}}/>Malicious (absorbed inside Aegis)</div>}
        </div>
        <div className="grid md:grid-cols-3 gap-4 mb-8">
          {[{label:'Aegis Ingestion',val:`${fmt(disp.aegisRate)} req/s`,sub:isAtk?'▲ Absorbing flood':'— Nominal',c:isAtk?TC.attack:'#a8a29e'},{label:'Client Server Load',val:`${disp.clientRate} req/s`,sub:isAtk?'✓ Stable — shielded':'— Nominal',c:isAtk?TC.sage:'#a8a29e'},{label:'Packets Neutralised',val:disp.absorbed.toLocaleString(),sub:isAtk?'Dropped in Aegis buffer':'— No active attack',c:'#a8a29e'}].map((m,i)=>(
            <div key={i} className="border border-stone-200 dark:border-stone-700 rounded-sm p-5">
              <div className="text-xs text-stone-400 uppercase tracking-widest mb-3">{m.label}</div>
              <div className="serif text-3xl font-medium text-stone-900 dark:text-stone-100 mb-1.5">{m.val}</div>
              <div className="text-xs" style={{color:m.c,fontWeight:i<2&&isAtk?500:400}}>{m.sub}</div>
            </div>
          ))}
        </div>
        <div className="flex items-center justify-between flex-wrap gap-4 pt-6 border-t border-stone-200 dark:border-stone-800">
          <div className={`flex items-start gap-2.5 max-w-sm transition-opacity duration-500 ${isAtk?'opacity-100':'opacity-0 pointer-events-none'}`}>
            <span className="w-2 h-2 rounded-full mt-1.5 flex-shrink-0" style={{background:TC.sage,animation:isAtk?'blink 1.4s infinite':undefined}}/>
            <div><div className="font-medium text-sm text-stone-700 dark:text-stone-300">Aegis is absorbing the attack.</div><div className="text-stone-400 text-xs mt-0.5 leading-relaxed">Malicious packets are trapped inside Aegis. Clean traffic continues uninterrupted.</div></div>
          </div>
          <div className="flex items-center gap-4">
            {isAtk&&<button onClick={reset} className="text-sm text-stone-400 hover:text-stone-700 dark:hover:text-stone-200 transition-colors underline underline-offset-2">Reset</button>}
            <button onClick={simulate} disabled={isAtk} className={`text-sm font-medium px-5 py-2.5 rounded-sm border transition-colors ${isAtk?'border-stone-200 dark:border-stone-800 text-stone-300 dark:text-stone-600 cursor-not-allowed bg-stone-50 dark:bg-stone-800':'border-stone-300 dark:border-stone-600 text-stone-700 dark:text-stone-300 hover:bg-stone-100 dark:hover:bg-stone-800'}`}>
              {isAtk?'Attack in progress…':'Simulate volumetric attack'}
            </button>
          </div>
        </div>
      </div>
    </section>
  );
};

    {id:6, label:'Running health checks…',              delay:6200},
  ];

  const runProvisioning = () => {
    setStep(2);
    setProvItems([]);
    PROV_STEPS.forEach(ps => {
      setTimeout(() => {
        setProvItems(prev => [...prev, {id:ps.id, label:ps.label, done:false}]);
        setTimeout(() => {
          setProvItems(prev => prev.map(p => p.id===ps.id ? {...p,done:true} : p));
          if (ps.id === PROV_STEPS.length) {
            setTimeout(() => { setStep(3); setSuccess(false); setSuccess(true); }, 600);
          }
        }, 900);
      }, ps.delay);
    });
  };

  /* Step 1 submit — validate ARN format, then kick off provisioning */
  const handleArnSubmit = (e) => {
    e.preventDefault();
    const arn = arnValue.trim();
    if (!arn) return;
    const arnRe = /^arn:aws:iam::\d{12}:role\/[\w+=,.@/-]+$/;
    if (!arnRe.test(arn)) {
      setApiError('Invalid ARN format. Expected: arn:aws:iam::123456789012:role/AegisProvisionRole');
      return;
    }
    setApiError('');
    setVerifying(true);
    // Simulate STS assumption check
    setTimeout(() => {
      setVerifying(false);
      setTenantData({domain_name: arn, tenant_id: 'vpc-'+Math.random().toString(36).slice(2,10), ingress_ip: '10.0.'+Math.floor(Math.random()*4+1)+'.'+Math.floor(Math.random()*254+1)});
      runProvisioning();
    }, 1400);
  };

  const shortArn = arnValue.length > 40 ? arnValue.slice(0,18)+'…'+arnValue.slice(-12) : arnValue;

  return (
    <div style={{minHeight:'100vh',background:'var(--bg-app)'}}>
      <div className="fixed top-16 inset-x-0 z-30 h-px bg-stone-100 dark:bg-stone-800">
        <div className="h-full bg-stone-300 dark:bg-stone-600 transition-all duration-700 ease-in-out"
          style={{width:step===1?'33%':step===2?'66%':'100%'}}/>
      </div>
      <div className="pt-28 pb-24 max-w-xl mx-auto px-8">
        <button onClick={onBack} className="flex items-center gap-1.5 text-sm text-stone-400 hover:text-stone-700 dark:hover:text-stone-200 transition-colors mb-12"><BackIco/> Back to Home Page</button>

        {/* Stepper */}
        <div className="flex items-start mb-16">
          {STEP_LABELS.map((label,i)=>(
            <React.Fragment key={i}>
              <div className="flex flex-col items-center gap-2.5" style={{minWidth:'80px'}}>
                <div className="w-7 h-7 rounded-full flex items-center justify-center text-xs font-semibold flex-shrink-0 transition-all duration-300"
                  style={{background:step>=i+1?'var(--text-primary)':'var(--bg-subtle)',color:step>=i+1?'var(--bg-app)':'var(--text-faint)',border:step>i+1||step===i+1?'none':'1px solid var(--border)'}}>
                  {step>i+1?<svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg>:i+1}
                </div>
                <span className="text-xs text-center leading-tight" style={{color:step===i+1?'var(--text-primary)':step>i+1?'var(--text-muted)':'var(--text-faint)',fontWeight:step===i+1?500:400,maxWidth:'70px'}}>{label}</span>
              </div>
              {i<STEP_LABELS.length-1&&<div className="flex-1 h-px mt-3.5 mx-3 transition-all duration-700" style={{background:step>i+1?'var(--text-primary)':'var(--border)'}}/>}
            </React.Fragment>
          ))}
        </div>

        {/* ── Step 1: Cloud Authentication ── */}
        {step===1&&(
          <div className="fade-up">
            <div className="text-xs uppercase tracking-widest text-stone-400 mb-4">Step 1 of 3 · Cloud Authentication</div>
            <h2 className="serif text-4xl font-medium text-stone-900 dark:text-stone-100 leading-tight mb-3">Grant provisioning access.</h2>
            <p className="text-stone-500 dark:text-stone-400 leading-relaxed mb-2 text-sm">Create a cross-account IAM Role in your AWS account and provide its ARN. Aegis will assume this role via STS to provision your VPC stack, then immediately release access.</p>
            <div className="border border-stone-100 dark:border-stone-800 rounded-sm bg-white dark:bg-stone-900 px-4 py-3 mb-7">
              {[
                'Go to AWS IAM → Roles → Create Role',
                'Trusted entity: Another AWS account (ID: 123456789012)',
                'Attach policy: AegisProvisionPolicy (see GitHub)',
                'Name it AegisProvisionRole and copy the ARN below',
              ].map((s,i)=>(
                <div key={i} className="flex items-start gap-3 py-1.5">
                  <span className="text-xs font-mono text-stone-300 dark:text-stone-600 flex-shrink-0 mt-0.5">{String(i+1).padStart(2,'0')}</span>
                  <span className="text-xs text-stone-500 dark:text-stone-400 leading-relaxed">{s}</span>
                </div>
              ))}
            </div>
            <form onSubmit={handleArnSubmit}>
              <div className="mb-2">
                <label className="block text-xs text-stone-500 dark:text-stone-400 mb-2 tracking-wide uppercase">AWS IAM Role ARN</label>
                <input type="text" className="fi" placeholder="arn:aws:iam::123456789012:role/AegisProvisionRole"
                  autoFocus value={arnValue} onChange={e=>{setArnValue(e.target.value);setApiError('');}} disabled={verifying}
                  style={{fontSize:'14px',padding:'13px 15px',fontFamily:'monospace'}}/>
              </div>
              <p className="text-xs text-stone-400 mb-5">Format: <span className="font-mono">arn:aws:iam::&lt;account-id&gt;:role/&lt;role-name&gt;</span></p>
              {apiError&&<div className="border border-stone-200 dark:border-stone-700 bg-white dark:bg-stone-900 rounded-sm px-4 py-3.5 mb-5"><div className="text-xs text-stone-600 dark:text-stone-300 leading-relaxed font-mono whitespace-pre-wrap">{apiError}</div></div>}
              <button type="submit" className="pb" disabled={verifying||!arnValue.trim()} style={{padding:'13px'}}>
                {verifying?'Verifying IAM access…':'Authenticate & Deploy →'}
              </button>
            </form>
          </div>
        )}

        {/* ── Step 2: Infrastructure Provisioning ── */}
        {step===2&&(
          <div className="fade-up">
            <div className="text-xs uppercase tracking-widest text-stone-400 mb-4">Step 2 of 3 · Infrastructure Provisioning</div>
            <h2 className="serif text-4xl font-medium text-stone-900 dark:text-stone-100 leading-tight mb-3">Deploying your stack…</h2>
            <p className="text-stone-500 dark:text-stone-400 leading-relaxed mb-2 text-sm">Aegis is provisioning resources inside your VPC using your IAM Role. This typically completes in under 8 minutes.</p>
            <div className="text-xs font-mono text-stone-300 dark:text-stone-600 mb-8">{shortArn}</div>
            <div className="border border-stone-100 dark:border-stone-800 rounded-sm bg-white dark:bg-stone-900 overflow-hidden">
              {PROV_STEPS.map((ps,i) => {
                const item = provItems.find(p=>p.id===ps.id);
                const active = item && !item.done;
                const done   = item && item.done;
                return (
                  <div key={ps.id} className={`flex items-center gap-4 px-5 py-3.5 ${i<PROV_STEPS.length-1?'border-b border-stone-50 dark:border-stone-800':''} transition-all duration-300`}
                    style={{background: done?'rgba(106,148,121,0.03)':'var(--bg-surface)'}}>
                    <div className="w-5 h-5 flex-shrink-0 flex items-center justify-center">
                      {done ? (
                        <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke={TC.sage} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                      ) : active ? (
                        <span className="w-2 h-2 rounded-full" style={{background:'#b45309',animation:'blink 1s infinite',display:'inline-block'}}/>
                      ) : (
                        <span className="w-2 h-2 rounded-full bg-stone-200 dark:bg-stone-700" style={{display:'inline-block'}}/>
                      )}
                    </div>
                    <span className="text-sm font-mono" style={{color: done?TC.sage : active?'var(--text-primary)':'var(--text-faint)'}}>{ps.label}</span>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* ── Step 3: Success ── */}
        {step===3&&success&&(
          <div className="fade-up text-center py-4">
            <div className="text-xs uppercase tracking-widest text-stone-400 mb-4">Step 3 of 3 · Deployment Complete</div>
            <div className="relative w-16 h-16 mx-auto mb-8">
              <div className="absolute inset-0 rounded-full" style={{background:'rgba(106,148,121,0.12)',animation:'pulseRing 2.2s ease-out infinite'}}/>
              <div className="absolute inset-0 rounded-full" style={{background:'rgba(106,148,121,0.18)',animation:'pulseRing 2.2s ease-out 0.65s infinite'}}/>
              <div className="absolute inset-4 rounded-full flex items-center justify-center" style={{background:TC.sage}}>
                <div className="w-4 h-4 text-white"><ShieldIco/></div>
              </div>
            </div>
            <div className="text-xs uppercase tracking-widest font-medium mb-4" style={{color:TC.sage}}>Infrastructure Deployed</div>
            <h2 className="serif text-3xl font-medium text-stone-900 dark:text-stone-100 leading-tight mb-3">Traffic is now routed through<br/>your local Aegis SQS buffer.</h2>
            <p className="text-stone-500 dark:text-stone-400 text-sm leading-relaxed mb-6">Your AWS VPC is fully protected. All edge traffic passes through your in-VPC SQS buffer and AI core — no data leaves your cloud environment.</p>
            <div className="flex flex-wrap justify-center gap-2 mb-8">
              {['SQS Buffers ✓','EC2 Edge Sensors ✓','AI Core ✓','NACL Rules ✓'].map(b=>(
                <span key={b} className="text-xs font-mono border border-stone-200 dark:border-stone-700 rounded-sm px-2.5 py-1 bg-white dark:bg-stone-900" style={{color:TC.sage}}>{b}</span>
              ))}
            </div>
            {redirecting ? (
              <div className="flex items-center justify-center gap-2 text-sm text-stone-400">
                <span className="w-1.5 h-1.5 rounded-full" style={{background:TC.sage,animation:'blink 1.2s infinite',display:'inline-block'}}/>
                Redirecting to your dashboard…
              </div>
            ) : (
              <button className="pb max-w-xs mx-auto" onClick={()=>onSuccess&&onSuccess(tenantData)} style={{padding:'13px'}}>
                Open Dashboard →
              </button>
            )}
          </div>
        )}
      </div>
    </div>
  );
};

/* ═══════════════════════════════════════════════════════════════════════════
   DASHBOARD — Live Telemetry & Attack Simulation
   Phases: nominal → breach (3s) → mitigating (auto)
   ═══════════════════════════════════════════════════════════════════════════ */
const Dashboard = ({ tenantData, user, onBackToSite, onConfigureVpc, dark, onToggleDark }) => {
  const userName = user?.name || 'Guest';
  // Warning/alert tints need a dark-mode counterpart — a literal amber-50
  // (#fffbeb) reads as a jarring bright patch against a dark background.
  const warnBg     = dark ? 'rgba(180,83,9,0.14)' : '#fffbeb';
  const warnBorder = dark ? 'rgba(180,83,9,0.4)'   : '#fde68a';
  const warnText   = dark ? '#fbbf24' : '#92400e';
  const domain    = tenantData?.domain_name || 'api.demo-tenant.com';
  const tenId     = tenantData?.tenant_id   || 'demo';
  const ingressIp = tenantData?.ingress_ip  || '34.100.182.41';

  /* ── Simulation State ── */
  const [phase,       setPhase]       = useState('nominal'); // 'nominal'|'flashCrowd'|'breach'|'mitigating'
  const [simScenario, setSimScenario] = useState(null);      // null|'flashCrowd'|'botnet'
  const [events,      setEvents]      = useState([]);
  const [naclRules,   setNaclRules]   = useState([]);
  const [displayM,    setDisplayM]    = useState({ edge:375, anomaly:0.145, origin:372, entropy:7.62, sqsUtil:4.2 });

  const metricsRef    = useRef({ edge:375, anomaly:0.145, origin:372, entropy:7.62, sqsUtil:4.2 });
  const phaseRef      = useRef('nominal');
  const phaseTimerRef = useRef(null);
  const evtIdRef      = useRef(0);

  const addEvent = useCallback((msg, type='info') => {
    const t = new Date().toTimeString().slice(0,8);
    setEvents(prev => [{id:evtIdRef.current++, time:t, msg, type}, ...prev].slice(0,18));
  }, []);

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  /* breach → mitigating auto-timer (botnet only) */
  useEffect(() => {
    if (phase !== 'breach') return;
    phaseTimerRef.current = setTimeout(() => {
      setPhase('mitigating');
      addEvent('Boto3 NACL rules injected via aws_infrastructure/aegis_nacl.py.', 'success');
      addEvent('847 malicious IP ranges blocked. Attacker traffic dropped at the edge.', 'success');
      addEvent('Origin server fully isolated. Load normalizing.', 'success');
      addEvent('Threat neutralized. System secured.', 'success');
      setNaclRules([
        { rule:100, cidr:'203.0.113.0/24',  proto:'ALL', dir:'INBOUND', hits:'42,301' },
        { rule:110, cidr:'198.51.100.0/24', proto:'ALL', dir:'INBOUND', hits:'38,192' },
        { rule:120, cidr:'10.42.0.0/16',    proto:'ALL', dir:'INBOUND', hits:'21,445' },
      ]);
    }, 3000);
    return () => { if (phaseTimerRef.current) clearTimeout(phaseTimerRef.current); };
  }, [phase]);

  useEffect(() => {
    addEvent(`Aegis protection active for ${domain}. Monitoring live traffic.`, 'info');
  }, []);

  /* ── Animation loop (120ms) ── */
  useEffect(() => {
    const loop = setInterval(() => {
      const p = phaseRef.current;
      const m = metricsRef.current;
      const j = (v, r) => v + (Math.random()-0.5)*2*r;

      let tE, tA, tO, tN, tS;   // targets: edge, anomaly, origin, eNtropy, sqsUtil
      let fE, fA, fO, fN, fS;   // lerp factors

      if (p === 'nominal') {
        tE=j(375,75);  tA=Math.max(0.09,Math.min(0.21,j(0.15,0.03)));
        tO=j(375,60);  tN=Math.max(7.0,Math.min(8.0,j(7.65,0.12)));  tS=j(4.5,2);
        fE=0.10; fA=0.10; fO=0.10; fN=0.08; fS=0.12;
      } else if (p === 'flashCrowd') {
        // Entropy STAYS HIGH (slow lerp, high target) — legitimate diverse traffic
        tE=j(95000,5000); tA=Math.max(0.20,Math.min(0.30,j(0.25,0.03)));
        tO=j(2500,200);   tN=Math.max(7.3,Math.min(8.0,j(7.72,0.10))); tS=j(78,8);
        fE=0.35; fA=0.10; fO=0.20; fN=0.06; fS=0.18; // fN very slow: entropy barely moves
      } else if (p === 'breach') {
        // Entropy DROPS FAST (fast lerp, low target) — botnet coordinated attack
        tE=j(95000,4000); tA=0.92;
        tO=j(615,30);     tN=Math.max(1.0,Math.min(2.0,j(1.35,0.18))); tS=j(93,3);
        fE=0.35; fA=0.28; fO=0.06; fN=0.38; fS=0.25; // fN fast: entropy collapses visibly
      } else { /* mitigating */
        tE=j(400,50);  tA=Math.max(0.12,Math.min(0.18,j(0.14,0.02)));
        tO=j(400,20);  tN=Math.max(6.8,Math.min(8.0,j(7.5,0.2)));  tS=j(4.5,2);
        fE=0.22; fA=0.12; fO=0.18; fN=0.10; fS=0.20;
      }

      const L = (a,b,f) => a+(b-a)*f;
      const next = {
        edge:    Math.max(0,   L(m.edge,    tE, fE)),
        anomaly: Math.min(1,   Math.max(0,  L(m.anomaly, tA, fA))),
        origin:  Math.max(0,   L(m.origin,  tO, fO)),
        entropy: Math.min(8,   Math.max(0,  L(m.entropy, tN, fN))),
        sqsUtil: Math.min(100, Math.max(0,  L(m.sqsUtil, tS, fS))),
      };
      metricsRef.current = next;
      setDisplayM({...next});
    }, 120);
    return () => clearInterval(loop);
  }, []);

  /* ── Launch: Flash Crowd (Legitimate Viral Surge) ── */
  const launchFlashCrowd = () => {
    if (simScenario !== null) return;
    setSimScenario('flashCrowd');
    setPhase('flashCrowd');
    addEvent('Viral traffic surge detected. Edge ingestion climbing to 95,000+ req/s.', 'info');
    setTimeout(() => addEvent('IP entropy analysis: Diverse source IPs confirmed. Legitimate traffic pattern.', 'info'), 800);
    setTimeout(() => addEvent('SQS buffer auto-scaling. Forwarding increased clean traffic to origin.', 'info'), 1600);
    setTimeout(() => addEvent('AI verdict: Anomaly score nominal (0.25). No threat detected. Auto-scaling sustained.', 'info'), 2600);
  };

  /* ── Launch: Botnet (DDoS Attack) ── */
  const launchBotnet = () => {
    if (simScenario !== null) return;
    setSimScenario('botnet');
    setPhase('breach');
    addEvent('ALERT: Volumetric surge detected. Edge ingestion spiked to 95,000+ req/s.', 'alert');
    setTimeout(() => addEvent('IP entropy analysis: Narrow source IP range detected. Botnet pattern suspected.', 'alert'), 600);
    setTimeout(() => addEvent('SQS buffer expanding. AI Isolation Forest evaluating distribution.', 'alert'), 1400);
    setTimeout(() => addEvent('AI: Anomaly score climbing past threshold (0.60). Coordinated attack confirmed.', 'alert'), 2200);
  };

  const resetSim = () => {
    if (phaseTimerRef.current) clearTimeout(phaseTimerRef.current);
    setSimScenario(null); setPhase('nominal'); setNaclRules([]);
    metricsRef.current = {edge:375, anomaly:0.145, origin:372, entropy:7.62, sqsUtil:4.2};
    addEvent('Simulation reset. Nominal baseline monitoring resumed.', 'info');
  };

  /* ── Display helpers ── */
  const fmtReq = n => {
    const r = Math.round(n);
    return r>=10000 ? `${(r/1000).toFixed(0)}k` : r>=1000 ? `${(r/1000).toFixed(1)}k` : String(r);
  };

  const edgePct    = Math.min(100, (displayM.edge/100000)*100);
  const originPct  = Math.min(100, (displayM.origin/5000)*100);  // max 5k req/s for origin bar
  const anomalyPct = Math.min(100, displayM.anomaly*100);
  const entropyPct = (displayM.entropy/8)*100;

  const breaching   = displayM.anomaly >= 0.60;
  const lowEntropy  = displayM.entropy  <  3.0;

  // Scenario-aware colors
  const slateBlue = '#475569';
  const edgeBarColor =
    phase==='flashCrowd' ? slateBlue :
    phase==='breach'     ? TC.amberBar : TC.sage;

  const statusTextColor =
    phase==='nominal'    ? '#78716c'  :
    phase==='flashCrowd' ? slateBlue  :
    phase==='breach'     ? TC.amber   : TC.sage;

  const statusMsg =
    phase==='nominal'    ? 'System Nominal. Forwarding clean traffic to origin server.'
    : phase==='flashCrowd' ? 'High Load / Benign Surge. IP diversity nominal. SQS Auto-scaling engaged.'
    : phase==='breach'   ? 'Low Entropy Surge. Botnet suspected. AI evaluating…'
    : 'Threat Isolated. Boto3 NACL Rule Injected. Network Secured.';

  const protectionDot =
    phase==='breach'     ? TC.amberBar :
    phase==='flashCrowd' ? slateBlue   : TC.sage;
  const protectionLabel =
    phase==='breach'     ? 'Under Attack' :
    phase==='flashCrowd' ? 'High Load'    :
    phase==='mitigating' ? 'Secured'      : 'Protected';

  /* ── Pipeline node states ── */
  const nodeState = (i) => {
    const s = {
      nominal:    ['neutral','neutral','neutral','neutral','safe'],
      flashCrowd: ['surge',  'surge',  'neutral','neutral','safe'],
      breach:     ['warn',   'warn',   'warn',   'neutral','safe'],
      mitigating: ['neutral','neutral','safe',   'safe',   'safe'],
    };
    return (s[phase] || s.nominal)[i];
  };
  const nodeColors = {
    neutral: { border:'var(--border-mid)',              bg:'var(--bg-surface)',                icon:'var(--text-faint)' },
    warn:    { border:warnBorder,                       bg:warnBg,                             icon:TC.amberBar },
    safe:    { border:'rgba(106,148,121,0.4)',          bg:'rgba(106,148,121,0.05)',           icon:TC.sage },
    surge:   { border:'#cbd5e1',                       bg:'rgba(71,85,105,0.04)',              icon:slateBlue },
  };
  const pipelineNodes = [
    { icon:<GlobeIco/>,  label:'Open Internet',  sub:'Traffic source' },
    { icon:<BoxIco/>,    label:'SQS Buffer',      sub:'Aegis Absorber' },
    { icon:<BrainIco/>,  label:'AI Engine',       sub:'Isolation Forest' },
    { icon:<NaclIco/>,   label:'VPC NACL',        sub:'AWS Firewall' },
    { icon:<ServerIco/>, label:'Origin Server',   sub:'Your server' },
  ];
  const connectorColor = (i) => {
    if (phase==='flashCrowd' && i<=1) return '#cbd5e1';
    if (phase==='breach' && i>=0 && i<=2) return '#fde68a';
    if (phase==='mitigating' && i>=1) return 'rgba(106,148,121,0.4)';
    return '#e7e5e4';
  };

  /* ── Phase timeline cards (scenario-aware) ── */
  const flashCrowdPhases = [
    { label:'Phase 1 · Nominal',      active:phase==='nominal',     done:simScenario==='flashCrowd',
      detail:'Edge ~375 req/s · Entropy HIGH · Origin stable', color:'sage' },
    { label:'Phase 2 · Viral Surge',  active:phase==='flashCrowd',  done:false,
      detail:'Edge ~95k req/s · Entropy stays HIGH · Origin scales to ~2.5k', color:'slate' },
  ];
  const botnetPhases = [
    { label:'Phase 1 · Nominal',          active:phase==='nominal',     done:simScenario==='botnet',
      detail:'Edge ~375 req/s · Entropy HIGH · Anomaly ~0.15', color:'sage' },
    { label:'Phase 2 · Volumetric Breach',active:phase==='breach',      done:phase==='mitigating',
      detail:'Edge spikes 95k+ · Entropy DROPS · Anomaly → 0.92', color:'amber' },
    { label:'Phase 3 · Mitigation',       active:phase==='mitigating',  done:false,
      detail:'NACL injected · Entropy recovers · Origin stable', color:'sage' },
  ];
  const phaseCards = simScenario === 'flashCrowd' ? flashCrowdPhases : simScenario === 'botnet' ? botnetPhases : null;
  const phaseCardColor = (p) => ({
    active: { sage:'rgba(106,148,121,0.4)', slate:'#cbd5e1', amber:warnBorder }[p.color],
    bg:     { sage:'rgba(106,148,121,0.04)', slate:'rgba(71,85,105,0.04)', amber:warnBg }[p.color],
    dot:    { sage:TC.sage, slate:slateBlue, amber:TC.amberBar }[p.color],
    text:   { sage:TC.sage, slate:slateBlue, amber:warnText }[p.color],
  });

  return (
    <div style={{minHeight:'100vh', background:'var(--bg-app)'}}>

      {/* Dashboard nav */}
      <div className="fixed top-0 inset-x-0 z-40 bg-stone-50/97 dark:bg-stone-950/97 backdrop-blur-md border-b border-stone-200 dark:border-stone-800">
        <div className="max-w-6xl mx-auto px-8 h-16 flex items-center justify-between">
          <div className="flex items-center gap-3 min-w-0">
            <div className="w-4 h-4 text-stone-700 dark:text-stone-300 flex-shrink-0"><ShieldIco/></div>
            <span className="text-sm font-semibold text-stone-900 dark:text-stone-100 flex-shrink-0">Aegis</span>
            <span className="w-px h-4 bg-stone-200 dark:bg-stone-800 mx-1 flex-shrink-0"/>
            <span className="text-sm text-stone-500 dark:text-stone-400 font-mono truncate hidden sm:block">{domain}</span>
            <div className="flex items-center gap-1.5 flex-shrink-0">
              <span className="w-1.5 h-1.5 rounded-full" style={{background:protectionDot, animation:'blink 1.4s infinite', display:'inline-block'}}/>
              <span className="text-xs font-medium transition-colors duration-500" style={{color:protectionDot}}>{protectionLabel}</span>
            </div>
          </div>
          <div className="flex items-center gap-4">
            <ThemeToggle dark={dark} onToggle={onToggleDark}/>
            <button onClick={onBackToSite} className="text-sm text-stone-400 hover:text-stone-700 dark:hover:text-stone-200 transition-colors hidden sm:block">← Back to Home Page</button>
            <div className="flex items-center gap-2">
              <div className="w-6 h-6 rounded-full bg-stone-200 dark:bg-stone-700 flex items-center justify-center text-xs font-bold text-stone-700 dark:text-stone-200 flex-shrink-0">{initials(userName)}</div>
              <span className="text-sm font-medium text-stone-700 dark:text-stone-300 hidden md:block">{userName}</span>
            </div>
          </div>
        </div>
      </div>

      <div className="pt-24 pb-20 max-w-6xl mx-auto px-8">

        {/* Page header */}
        <div className="mb-10 pt-2">
          <div className="text-xs uppercase tracking-widest text-stone-400 mb-2">Tenant Dashboard · {user?.tier==='enterprise' ? 'Aegis Enterprise · VPC Deployment' : 'Aegis Shield · Edge Proxy'}</div>
          <div className="flex items-end gap-4 flex-wrap">
            <h1 className="serif text-3xl font-medium text-stone-900 dark:text-stone-100">{domain}</h1>
            <span className="text-sm font-mono text-stone-400 border border-stone-200 dark:border-stone-700 rounded-sm px-2.5 py-1 bg-white dark:bg-stone-900 mb-0.5">{tenId.slice(0,12)}…</span>
            {user?.tier==='enterprise' && (
              <button onClick={onConfigureVpc} className="text-xs text-stone-500 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-100 underline underline-offset-2 mb-1">Configure AWS VPC →</button>
            )}
          </div>
          <p className="text-sm text-stone-400 mt-1.5">
            Ingress IP: <span className="font-mono">{ingressIp}</span>
            <span className="mx-2">·</span>
            CNAME → <span className="font-mono">{tenantData?.cname_target||'ingress.aegis-shield.net'}</span>
          </p>
        </div>

        {/* ── Metric Cards (4-column) ── */}
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-5">

          {/* 1. Edge Ingestion Rate */}
          <div className="card p-6">
            <div className="text-xs uppercase tracking-widest text-stone-400 mb-5">Edge Ingestion Rate</div>
            <div className="flex items-baseline gap-2 mb-1.5">
              <span className="serif text-4xl font-medium text-stone-900 dark:text-stone-100" style={{lineHeight:1,fontVariantNumeric:'tabular-nums'}}>{fmtReq(displayM.edge)}</span>
              <span className="text-sm text-stone-400">req/s</span>
            </div>
            <div className="text-xs mb-4 h-4 transition-colors duration-400" style={{color:edgeBarColor}}>
              {phase==='nominal'    ? '↑ Nominal baseline (SQS buffer idle)'
               : phase==='flashCrowd' ? '↑↑ Surge — SQS absorbing & forwarding'
               : phase==='breach'   ? '↑↑ Surge absorbed by SQS buffer'
               : '↓ Attack traffic blocked by NACL'}
            </div>
            <div className="metric-bar">
              <div className="metric-bar-fill" style={{width:`${edgePct.toFixed(2)}%`, background:edgeBarColor}}/>
            </div>
            <div className="flex justify-between mt-1.5">
              <span className="text-xs text-stone-300 font-mono">0</span>
              <span className="text-xs text-stone-300 font-mono">100k req/s</span>
            </div>
          </div>

          {/* 2. AI Anomaly Score */}
          <div className="card p-6 transition-all duration-500"
            style={{borderColor:breaching?warnBorder:'var(--border)', background:breaching?warnBg:'var(--bg-surface)'}}>
            <div className="text-xs uppercase tracking-widest text-stone-400 mb-5">AI Anomaly Score</div>
            <div className="flex items-baseline gap-2 mb-1.5">
              <span className="text-4xl font-mono font-medium transition-colors duration-300"
                style={{lineHeight:1, color:breaching?warnText:'var(--text-primary)', fontVariantNumeric:'tabular-nums'}}>
                {displayM.anomaly.toFixed(3)}
              </span>
              <span className="text-sm text-stone-400">/ 1.00</span>
            </div>
            <div className="text-xs mb-4 h-4 transition-colors duration-300"
              style={{color:breaching?warnText:TC.sage}}>
              {breaching ? '⚠ Threshold breached (>= 0.60)' : '✓ Within safe threshold (< 0.60)'}
            </div>
            <div className="relative metric-bar">
              <div className="metric-bar-fill" style={{width:`${anomalyPct.toFixed(2)}%`, background:breaching?TC.amberBar:TC.sage}}/>
              <div className="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-0.5 h-3 rounded-full" style={{left:'60%',background:'#fbbf24',zIndex:2}}/>
            </div>
            <div className="flex justify-between mt-1.5">
              <span className="text-xs text-stone-300 font-mono">0.00</span>
              <span className="text-xs font-mono" style={{color:'#f59e0b',opacity:.7}}>0.60</span>
              <span className="text-xs text-stone-300 font-mono">1.00</span>
            </div>
          </div>

          {/* 3. Origin Server Load */}
          <div className="card p-6">
            <div className="text-xs uppercase tracking-widest text-stone-400 mb-5">Origin Server Load</div>
            <div className="flex items-baseline gap-2 mb-1.5">
              <span className="serif text-4xl font-medium text-stone-900 dark:text-stone-100" style={{lineHeight:1,fontVariantNumeric:'tabular-nums'}}>{fmtReq(displayM.origin)}</span>
              <span className="text-sm text-stone-400">req/s</span>
            </div>
            <div className="text-xs mb-4 h-4" style={{color:phase==='flashCrowd'?slateBlue:TC.sage}}>
              {phase==='flashCrowd' ? '↑ Scaling — forwarding legitimate surge'
               : phase==='breach'  ? '✓ Stable — shielded by Aegis buffer'
               : '✓ Stable — clean traffic only'}
            </div>
            <div className="metric-bar">
              <div className="metric-bar-fill" style={{width:`${originPct.toFixed(2)}%`, background:phase==='flashCrowd'?slateBlue:TC.sage}}/>
            </div>
            <div className="flex justify-between mt-1.5">
              <span className="text-xs text-stone-300 font-mono">0</span>
              <span className="text-xs text-stone-300 font-mono">5k req/s</span>
            </div>
          </div>

          {/* 4. IP Distribution Entropy (NEW) */}
          <div className="card p-6 transition-all duration-500"
            style={{borderColor:lowEntropy?warnBorder:'var(--border)', background:lowEntropy?warnBg:'var(--bg-surface)'}}>
            <div className="text-xs uppercase tracking-widest text-stone-400 mb-5">IP Distribution Entropy</div>
            <div className="flex items-baseline gap-2 mb-1.5">
              <span className="text-4xl font-mono font-medium transition-colors duration-300"
                style={{lineHeight:1, color:lowEntropy?warnText:'var(--text-primary)', fontVariantNumeric:'tabular-nums'}}>
                {displayM.entropy.toFixed(2)}
              </span>
              <span className="text-sm text-stone-400">bits</span>
            </div>
            <div className="text-xs mb-1 h-4 transition-colors duration-300"
              style={{color:lowEntropy?warnText:TC.sage}}>
              {lowEntropy ? '⚠ Low — Coordinated botnet pattern' : '✓ High — Diverse legitimate sources'}
            </div>
            <div className="text-xs text-stone-300 font-mono mb-3">H = −Σ pᵢ log₂ pᵢ · Max 8 bits</div>
            <div className="metric-bar">
              <div className="metric-bar-fill" style={{width:`${entropyPct.toFixed(2)}%`, background:lowEntropy?TC.amberBar:TC.sage}}/>
            </div>
            <div className="flex justify-between mt-1.5">
              <span className="text-xs text-stone-300 font-mono">0.00</span>
              <span className="text-xs text-stone-300 font-mono">8.00 bits</span>
            </div>
          </div>

        </div>

        {/* ── SQS Buffer Utilization ── */}
        <div className="card p-5 mb-5">
          <div className="flex items-center justify-between mb-2.5">
            <div>
              <span className="text-xs uppercase tracking-widest text-stone-400 font-medium">SQS Buffer Utilization</span>
              <span className="ml-3 text-xs text-stone-300 font-mono hidden sm:inline">Aegis-Ingestion-Queue</span>
            </div>
            <span className="text-xs font-mono font-medium tabular-nums"
              style={{color:displayM.sqsUtil>85?TC.amberBar:displayM.sqsUtil>60?slateBlue:TC.sage}}>
              {Math.round(displayM.sqsUtil)}%
            </span>
          </div>
          <div className="h-1.5 bg-stone-100 dark:bg-stone-800 rounded-full overflow-hidden">
            <div className="h-full rounded-full transition-all duration-200"
              style={{
                width:`${displayM.sqsUtil.toFixed(1)}%`,
                background: displayM.sqsUtil>85 ? TC.amberBar : displayM.sqsUtil>60 ? slateBlue : TC.sage,
              }}/>
          </div>
          <div className="mt-2 text-xs" style={{color:'var(--text-faint)'}}>
            {displayM.sqsUtil > 85
              ? 'Buffer under heavy load. Messages queued for AI evaluation.'
              : displayM.sqsUtil > 55
              ? 'Buffer absorbing elevated traffic volume. Auto-scaling active.'
              : 'Buffer idle. Normal throughput. Messages processed in real-time.'}
          </div>
        </div>

        {/* ── Live Pipeline ── */}
        <div className="card p-6 mb-5">
          <div className="text-xs uppercase tracking-widest text-stone-400 mb-6">Live Traffic Pipeline</div>
          <div className="flex items-center">
            {pipelineNodes.map((node,i) => {
              const c = nodeColors[nodeState(i)];
              return (
                <React.Fragment key={i}>
                  <div className="flex flex-col items-center gap-2 flex-shrink-0" style={{minWidth:'72px'}}>
                    <div className="w-10 h-10 rounded-full flex items-center justify-center border-2 transition-all duration-500"
                      style={{borderColor:c.border, background:c.bg}}>
                      <div className="w-4 h-4 transition-colors duration-500" style={{color:c.icon}}>{node.icon}</div>
                    </div>
                    <div className="text-center" style={{maxWidth:'72px'}}>
                      <div className="text-xs font-medium text-stone-700 dark:text-stone-300 leading-tight">{node.label}</div>
                      <div className="text-xs text-stone-400 leading-tight">{node.sub}</div>
                    </div>
                  </div>
                  {i<pipelineNodes.length-1 && (
                    <div className="flex-1 mx-2 h-px transition-all duration-700" style={{background:connectorColor(i)}}/>
                  )}
                </React.Fragment>
              );
            })}
          </div>
          <div className="mt-6 pt-5 border-t border-stone-100 dark:border-stone-800 flex items-center gap-2">
            <span className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{background:statusTextColor, animation:'blink 1.4s infinite', display:'inline-block'}}/>
            <span className="text-xs transition-colors duration-400 leading-relaxed" style={{color:statusTextColor}}>{statusMsg}</span>
          </div>
        </div>

        {/* ── Stress Test ── */}
        <div className="card p-6 mb-5">
          <div className="mb-5">
            <div className="text-xs uppercase tracking-widest text-stone-400 mb-1.5">Stress Test Network</div>
            <p className="text-sm text-stone-500 dark:text-stone-400 max-w-2xl">
              Run two distinct scenarios to demonstrate how the AI differentiates a <strong className="text-stone-700 dark:text-stone-300 font-medium">legitimate viral surge</strong> (high entropy, scale-up) from a <strong className="text-stone-700 dark:text-stone-300 font-medium">coordinated botnet attack</strong> (entropy collapse, NACL injection).
            </p>
          </div>

          {/* Scenario preview / phase timeline */}
          {!simScenario && (
            <div className="grid sm:grid-cols-2 gap-3 mb-6">
              <div className="border border-stone-100 dark:border-stone-800 rounded-sm p-4">
                <div className="flex items-center gap-2 mb-2">
                  <span className="w-1.5 h-1.5 rounded-full bg-slate-400 flex-shrink-0" style={{display:'inline-block'}}/>
                  <span className="text-xs font-medium" style={{color:slateBlue}}>Viral Launch Scenario</span>
                </div>
                <p className="text-xs text-stone-400 leading-relaxed">Edge spikes to 95k req/s · IP entropy stays HIGH (diverse sources) · Anomaly score stays LOW · Origin scales up safely to ~2.5k req/s</p>
              </div>
              <div className="border border-stone-100 dark:border-stone-800 rounded-sm p-4">
                <div className="flex items-center gap-2 mb-2">
                  <span className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{background:TC.amberBar, display:'inline-block'}}/>
                  <span className="text-xs font-medium" style={{color:warnText}}>Botnet DDoS Scenario</span>
                </div>
                <p className="text-xs text-stone-400 leading-relaxed">Edge spikes to 95k req/s · IP entropy DROPS (narrow botnet IPs) · Anomaly score breaches 0.60 · Origin shielded · NACL injected</p>
              </div>
            </div>
          )}

          {phaseCards && (
            <div className={`grid gap-3 mb-6 ${phaseCards.length===2?'grid-cols-2':'grid-cols-3'}`}>
              {phaseCards.map((p,i) => {
                const pc = phaseCardColor(p);
                return (
                  <div key={i} className="border rounded-sm p-3.5 transition-all duration-500"
                    style={{
                      borderColor: p.active ? pc.active : p.done ? 'rgba(106,148,121,0.25)' : 'var(--border)',
                      background:  p.active ? pc.bg    : 'transparent',
                    }}>
                    <div className="flex items-center gap-2 mb-1.5">
                      <span className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{
                        background: p.done ? TC.sage : p.active ? pc.dot : 'var(--border-mid)',
                        animation: p.active ? 'blink 1.4s infinite' : 'none',
                        display:'inline-block',
                      }}/>
                      <span className="text-xs font-medium" style={{
                        color: p.done ? TC.sage : p.active ? pc.text : 'var(--text-faint)',
                      }}>{p.label}</span>
                    </div>
                    <p className="text-xs text-stone-400 leading-relaxed">{p.detail}</p>
                  </div>
                );
              })}
            </div>
          )}

          {/* Two scenario buttons */}
          <div className="flex flex-wrap items-center gap-3">
            <button onClick={launchFlashCrowd} disabled={simScenario !== null}
              className="text-sm font-medium px-5 py-2.5 border rounded-sm transition-all duration-200"
              style={{
                borderColor: simScenario==='flashCrowd' ? '#cbd5e1' : simScenario!==null ? 'var(--border)' : slateBlue,
                color:       simScenario==='flashCrowd' ? slateBlue  : simScenario!==null ? 'var(--text-faint)' : slateBlue,
                background:  simScenario==='flashCrowd' ? 'rgba(71,85,105,0.04)' : 'transparent',
                cursor:      simScenario!==null ? 'not-allowed' : 'pointer',
              }}>
              {simScenario==='flashCrowd' ? 'Viral Launch in progress…' : 'Simulate Viral Launch (Flash Crowd)'}
            </button>

            <button onClick={launchBotnet} disabled={simScenario !== null}
              className="text-sm font-medium px-5 py-2.5 border rounded-sm transition-all duration-200"
              style={{
                borderColor: simScenario==='botnet' && phase==='breach' ? warnBorder : simScenario==='botnet' ? 'var(--border-mid)' : simScenario!==null ? 'var(--border)' : 'var(--text-primary)',
                color:       simScenario==='botnet' && phase==='breach' ? warnText : simScenario==='botnet' ? 'var(--text-faint)' : simScenario!==null ? 'var(--text-faint)' : 'var(--text-primary)',
                background:  simScenario==='botnet' && phase==='breach' ? warnBg : 'transparent',
                cursor:      simScenario!==null ? 'not-allowed' : 'pointer',
              }}>
              {simScenario==='botnet' && phase==='breach'     ? 'Botnet Attack in progress…'
               : simScenario==='botnet' && phase==='mitigating' ? '✓ Threat neutralized'
               : 'Simulate Botnet (DDoS Attack)'}
            </button>

            {simScenario !== null && (
              <button onClick={resetSim} className="text-sm text-stone-400 hover:text-stone-700 dark:hover:text-stone-200 transition-colors underline underline-offset-2">
                Reset
              </button>
            )}
          </div>
        </div>

        {/* ── NACL Rules (botnet mitigating only) ── */}
        {naclRules.length > 0 && (
          <div className="card overflow-hidden mb-5 fade-up">
            <div className="px-5 py-3.5 border-b border-stone-100 dark:border-stone-800 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <span className="text-xs uppercase tracking-widest text-stone-500 dark:text-stone-400 font-medium">Boto3 NACL Rules Injected</span>
                <span className="text-xs text-stone-300 font-mono hidden sm:block">aws_infrastructure/aegis_nacl.py</span>
              </div>
              <span className="flex items-center gap-1.5 text-xs font-medium" style={{color:TC.sage}}>
                <span className="w-1.5 h-1.5 rounded-full" style={{background:TC.sage,animation:'blink 1.4s infinite',display:'inline-block'}}/>
                Active
              </span>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full">
                <thead>
                  <tr className="border-b border-stone-100 dark:border-stone-800">
                    {['Rule #','Action','Source CIDR','Protocol','Direction','Hits'].map(h=>(
                      <th key={h} className="px-5 py-2.5 text-left text-xs text-stone-400 font-medium uppercase tracking-wide whitespace-nowrap">{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {naclRules.map((r,i)=>(
                    <tr key={i} className="border-b border-stone-50 dark:border-stone-800 hover:bg-stone-50 dark:hover:bg-stone-800 transition-colors">
                      <td className="px-5 py-3 text-xs font-mono text-stone-600 dark:text-stone-300">{r.rule}</td>
                      <td className="px-5 py-3 text-xs font-mono font-semibold" style={{color:warnText}}>DENY</td>
                      <td className="px-5 py-3 text-xs font-mono text-stone-600 dark:text-stone-300">{r.cidr}</td>
                      <td className="px-5 py-3 text-xs font-mono text-stone-400">{r.proto}</td>
                      <td className="px-5 py-3 text-xs font-mono text-stone-400">{r.dir}</td>
                      <td className="px-5 py-3 text-xs font-mono text-stone-600 dark:text-stone-300">{r.hits}</td>
                    </tr>
                  ))}
                  <tr>
                    <td colSpan="6" className="px-5 py-3 text-xs text-stone-400 font-mono">
                      + 844 additional rules auto-injected · Rule 32766: Allow all (legitimate traffic baseline)
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        )}

        {/* ── Event Log ── */}
        <div className="card overflow-hidden">
          <div className="px-5 py-3.5 border-b border-stone-100 dark:border-stone-800 flex items-center justify-between">
            <span className="text-xs uppercase tracking-widest text-stone-500 dark:text-stone-400 font-medium">Event Log</span>
            <span className="text-xs text-stone-300 font-mono">{events.length} entries</span>
          </div>
          <div style={{maxHeight:'260px', overflowY:'auto'}}>
            {events.length === 0 && (
              <div className="px-5 py-5 text-xs text-stone-300 font-mono">No events yet.</div>
            )}
            {events.map((e,i) => (
              <div key={e.id} className={`flex items-start gap-4 px-5 py-3 ${i<events.length-1?'border-b border-stone-50 dark:border-stone-800':''}`}>
                <span className="text-xs font-mono text-stone-300 flex-shrink-0 mt-0.5 tabular-nums">{e.time}</span>
                <span className="text-xs leading-relaxed transition-colors" style={{
                  color: e.type==='alert'   ? warnText
                       : e.type==='success' ? TC.sage
                       : e.type==='info' && simScenario==='flashCrowd' ? slateBlue
                       : 'var(--text-muted)'
                }}>{e.msg}</span>
              </div>
            ))}
          </div>
        </div>

      </div>
    </div>
  );
};



/* ═══════════════════════════════════════════════════════════
   APP ROOT
   ═══════════════════════════════════════════════════════════ */
const App = () => {
  const { user, signIn, signUp, signOut, lookupEmail } = useAuth();
  const [dark, toggleDark] = useDarkMode();
  const [modalOpen,   setModalOpen]   = useState(false);
  const [view,        setView]        = useState('landing');
  const [dashTenant,  setDashTenant]  = useState(null);

  const openSignIn   = useCallback(()=>setModalOpen(true), []);
  const closeModal   = useCallback(()=>setModalOpen(false), []);
  // Clear any prior tenant data on sign-out — otherwise the next person to
  // sign in on this browser would briefly see the previous user's dashboard.
  const doSignOut    = useCallback(()=>{ signOut(); setDashTenant(null); setView('landing'); window.scrollTo(0,0); }, [signOut]);
  const goProtect    = useCallback(()=>{ setView('onboarding');  window.scrollTo(0,0); }, []);
  const goLanding    = useCallback(()=>{ setView('landing');     window.scrollTo(0,0); }, []);
  const goDashboard  = useCallback(()=>{ setView('dashboard');   window.scrollTo(0,0); }, []);

  /* Authenticated users land straight on their dashboard — the desktop app
     download is the primary path now, this web dashboard is a live preview. */
  const handleAuthed = useCallback(() => { setDashTenant(null); setView('dashboard'); window.scrollTo(0,0); }, []);

  /* Called by Onboarding when a VPC ARN is verified — jumps to dashboard with that tenant */
  const handleOnboardingSuccess = useCallback((data) => {
    setDashTenant(data);
    setView('dashboard');
    window.scrollTo(0,0);
  }, []);

  return (
    <div style={{background:'var(--bg-app)', minHeight:'100vh'}}>
      {modalOpen && <AuthModal onClose={closeModal} onAuthed={handleAuthed} lookupEmail={lookupEmail} signIn={signIn} signUp={signUp}/>}

      {/* Main Nav — hidden on dashboard (dashboard has its own header) */}
      {view !== 'dashboard' && (
        <Nav
          user={user}
          onSignIn={openSignIn}
          onSignOut={doSignOut}
          onLogoClick={goLanding}
          onDashboard={goDashboard}
          dark={dark}
          onToggleDark={toggleDark}
        />
      )}

      {view === 'landing' && (
        <>
          <Hero     user={user} onDashboard={goDashboard}/>
          <Stats/>
          <HowItWorks/>
          <Simulator/>
          <Research/>
          <CTA      user={user} onDashboard={goDashboard}/>
          <Footer   onSignIn={openSignIn}/>
        </>
      )}

      {view === 'onboarding' && (
        <Onboarding onBack={goLanding} onSuccess={handleOnboardingSuccess}/>
      )}

      {view === 'dashboard' && (
        <Dashboard
          tenantData={dashTenant}
          user={user}
          onBackToSite={goLanding}
          onConfigureVpc={goProtect}
          dark={dark}
          onToggleDark={toggleDark}
        />
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
